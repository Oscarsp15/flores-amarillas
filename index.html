    for (let i = 0; i < np; i++) {
      const a = rand(0, 6.2832), r = rand(0.2, 0.8);
      pond.pads.push({ x: pond.x + Math.cos(a) * pond.rx * r, y: pond.y + Math.sin(a) * pond.ry * r, s: rand(7, 13), rot: rand(0, 6.2832) });
    }
    const nr = 6 + Math.floor(srand() * 5);
    for (let i = 0; i < nr; i++) {
      const side = srand() < 0.5 ? -1 : 1;
      pond.reeds.push({ x: pond.x + side * pond.rx * rand(0.7, 1.05), h: rand(26, 60), ph: rand(0, 6.2832), bend: rand(-0.3, 0.3) });
    }
    makeKoi();
  }

  function makeKoi() {
    koi = [];
    for (let i = 0; i < 4; i++) {
      koi.push({
        a: rand(0, 6.2832), rad: rand(0.25, 0.7), sp: rand(0.25, 0.5) * (srand() < 0.5 ? 1 : -1),
        size: rand(9, 15), ph: rand(0, 6.2832), body: srand() < 0.5 ? "#fff2dc" : "#f08a3c"
      });
    }
  }

  function drawKoi(k) {
    const p = pond;
    const x = p.x + Math.cos(k.a) * p.rx * k.rad;
    const y = p.y + Math.sin(k.a) * p.ry * k.rad;
    const dir = k.sp >= 0 ? 1 : -1;
    const ang = Math.atan2(Math.cos(k.a) * p.ry * k.rad * dir, -Math.sin(k.a) * p.rx * k.rad * dir);
    const s = k.size, sway = Math.sin(t * 5 + k.ph) * 0.45;
    ctx.save();
    ctx.translate(x, y); ctx.rotate(ang);
    ctx.globalAlpha = 0.92;
    const tg = ctx.createLinearGradient(-s, 0, s, 0);
    tg.addColorStop(0, k.body); tg.addColorStop(1, "#ffffff");
    ctx.fillStyle = tg;
    ctx.beginPath();
    ctx.moveTo(-s * 0.8, 0);
    ctx.quadraticCurveTo(-s * 1.5, -s * 0.5 + sway * s, -s * 1.9, sway * s);
    ctx.quadraticCurveTo(-s * 1.5, s * 0.5 + sway * s, -s * 0.8, 0);
    ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 0, s, s * 0.4, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "rgba(200,80,30,0.5)";
    ctx.beginPath(); ctx.ellipse(s * 0.25, -s * 0.08, s * 0.3, s * 0.16, 0, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-s * 0.2, s * 0.08, s * 0.22, s * 0.13, 0, 0, 6.2832); ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1;
  }

  function drawPond() {
    if (!pond) return;
    const p = pond;
    ctx.save();
    ctx.beginPath(); ctx.ellipse(p.x, p.y, p.rx, p.ry, 0, 0, 6.2832);
    const wg = ctx.createLinearGradient(0, p.y - p.ry, 0, p.y + p.ry);
    wg.addColorStop(0, rgbStr(lerpRgb(pal.mid, pal.h2, 0.35)));
    wg.addColorStop(0.5, rgbStr(lerpRgb(pal.h1, pal.g1, 0.45)));
    wg.addColorStop(1, rgbStr(lerpRgb(pal.g1, [10, 14, 20], 0.5)));
    ctx.fillStyle = wg; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "rgba(18,26,26,0.5)"; ctx.stroke();

    ctx.save();
    ctx.beginPath(); ctx.ellipse(p.x, p.y, p.rx, p.ry, 0, 0, 6.2832); ctx.clip();
    const s = sunPos();
    const glintX = p.x + clamp((s.x - p.x) / W, -0.5, 0.5) * p.rx * 0.8;
    const col = s.a > 0 ? pal.sun : [200, 215, 255];
    const gg = ctx.createRadialGradient(glintX, p.y, 0, glintX, p.y, p.rx * 0.6);
    gg.addColorStop(0, rgba(col, 0.35 * clamp(Math.abs(s.a) * 1.6, 0, 1)));
    gg.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = gg; ctx.fillRect(p.x - p.rx, p.y - p.ry, p.rx * 2, p.ry * 2);
    for (let i = 0; i < 3; i++) {
      const rp = (t * 0.14 + i / 3) % 1;
      ctx.strokeStyle = `rgba(255,255,255,${0.07 * (1 - rp)})`;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, p.rx * (0.18 + rp * 0.72), p.ry * (0.18 + rp * 0.72), 0, 0, 6.2832); ctx.stroke();
    }
    for (const k of koi) drawKoi(k);
    for (const pad of p.pads) {
      ctx.save(); ctx.translate(pad.x, pad.y); ctx.rotate(pad.rot);
      ctx.fillStyle = "rgba(70,120,60,0.9)";
      ctx.beginPath(); ctx.ellipse(0, 0, pad.s, pad.s * 0.72, 0, 0, 6.2832); ctx.fill();
      ctx.fillStyle = "rgba(30,60,30,0.9)";
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(pad.s * 1.05, -pad.s * 0.18); ctx.lineTo(pad.s * 1.05, pad.s * 0.18); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    ctx.strokeStyle = "rgba(90,120,70,0.85)"; ctx.lineWidth = 2;
    for (const rd of p.reeds) {
      const sway = Math.sin(t * 1.2 + rd.ph) * 0.25 + wind * 0.5;
      ctx.beginPath();
      ctx.moveTo(rd.x, p.y + p.ry * 0.4);
      ctx.quadraticCurveTo(rd.x + rd.bend * 10, p.y - rd.h * 0.5, rd.x + rd.bend * 20 + sway * 8, p.y - rd.h);
      ctx.stroke();
    }
    ctx.restore();
  }

  function makeGarland() {
    const x1 = W * 0.06, x2 = W * 0.94, yTop = H * 0.52, sag = H * 0.085;
    garland = { x1, x2, yTop, sag, bulbs: [] };
    const n = 28;
    for (let i = 0; i <= n; i++) {
      const u = i / n;
      garland.bulbs.push({ x: lerp(x1, x2, u), y: yTop + Math.sin(Math.PI * u) * sag, ph: rand(0, 6.2832) });
    }
  }

  function drawGarland() {
    if (!garland) return;
    const g = garland, night = clamp(pal.star * 1.3, 0, 1);
    ctx.strokeStyle = "rgba(38,30,20,0.85)"; ctx.lineWidth = Math.max(2, W * 0.0035);
    ctx.beginPath();
    ctx.moveTo(g.x1, H); ctx.lineTo(g.x1, g.yTop);
    ctx.moveTo(g.x2, H); ctx.lineTo(g.x2, g.yTop);
    ctx.stroke();
    ctx.strokeStyle = "rgba(28,24,18,0.5)"; ctx.lineWidth = 1;
    ctx.beginPath();
    g.bulbs.forEach((b, i) => i ? ctx.lineTo(b.x, b.y) : ctx.moveTo(b.x, b.y));
    ctx.stroke();
    for (const b of g.bulbs) {
      if (night > 0.02) {
        const flick = 0.7 + 0.3 * Math.sin(t * 2 + b.ph);
        ctx.save(); ctx.globalCompositeOperation = "lighter";
        const gg = ctx.createRadialGradient(b.x, b.y + 2, 0, b.x, b.y + 2, 11);
        gg.addColorStop(0, `rgba(255,210,130,${0.5 * night * flick})`);
        gg.addColorStop(1, "rgba(255,180,90,0)");
        ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(b.x, b.y + 2, 11, 0, 6.2832); ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle = `rgba(255,236,182,${0.22 + 0.78 * night})`;
      ctx.beginPath(); ctx.ellipse(b.x, b.y + 3, 2.2, 3.1, 0, 0, 6.2832); ctx.fill();
    }
  }

  function spawnLantern() {
    lanterns.push({
      x: rand(W * 0.08, W * 0.92), y: H + rand(10, 90),
      vx: rand(-6, 6), vy: -rand(22, 44), size: rand(5, 10), ph: rand(0, 6.2832), alpha: 0
    });
  }

  function updateLanterns(dt) {
    const night = pal.star;
    if (night > 0.35 && lanterns.length < 26 && srand() < dt * (0.25 + night * 0.9)) spawnLantern();
    for (let i = lanterns.length - 1; i >= 0; i--) {
      const l = lanterns[i];
      l.y += l.vy * dt;
      l.x += (l.vx + wind * 12 + Math.sin(t * 0.8 + l.ph) * 6) * dt;
      l.vy += 2 * dt;
      l.alpha += (0.95 - l.alpha) * Math.min(1, dt * 1.2);
      if (l.y < -60) lanterns.splice(i, 1);
    }
  }

  function drawLanterns() {
    for (const l of lanterns) {
      const s = l.size, a = l.alpha;
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      const g = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, s * 4.5);
      g.addColorStop(0, `rgba(255,205,125,${0.45 * a})`);
      g.addColorStop(1, "rgba(255,170,80,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(l.x, l.y, s * 4.5, 0, 6.2832); ctx.fill();
      ctx.restore();
      ctx.save(); ctx.globalAlpha = a;
      const bg = ctx.createLinearGradient(l.x, l.y - s, l.x, l.y + s);
      bg.addColorStop(0, "#ffdf9a"); bg.addColorStop(0.5, "#ffb44f"); bg.addColorStop(1, "#e8842a");
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.ellipse(l.x, l.y, s, s * 1.15, 0, 0, 6.2832); ctx.fill();
      ctx.fillStyle = "#c96a1e";
      ctx.beginPath(); ctx.ellipse(l.x, l.y - s * 1.05, s * 0.5, s * 0.18, 0, 0, 6.2832); ctx.fill();
      ctx.beginPath(); ctx.ellipse(l.x, l.y + s * 1.1, s * 0.35, s * 0.14, 0, 0, 6.2832); ctx.fill();
      ctx.globalCompositeOperation = "lighter";
      const fg = ctx.createRadialGradient(l.x, l.y + s * 0.2, 0, l.x, l.y + s * 0.2, s * 0.85);
      fg.addColorStop(0, `rgba(255,255,220,${0.9 * a})`); fg.addColorStop(1, "rgba(255,200,120,0)");
      ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(l.x, l.y + s * 0.2, s * 0.85, 0, 6.2832); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function newDragonfly() {
    return {
      x: rand(0, W), y: rand(horizon * 0.5, H * 0.9), vx: 0, vy: 0,
      tx: rand(0, W), ty: rand(horizon * 0.5, H * 0.9),
      sp: rand(1.6, 2.6), size: rand(6, 10), dir: 1, tilt: 0,
      flap: rand(0, 6.2832), retarget: rand(0.5, 2), dayAmt: 1
    };
  }
  function makeDragonflies() {
    dragonflies = [];
    const n = q(clamp(Math.round(W / 420), 2, 6));
    for (let i = 0; i < n; i++) dragonflies.push(newDragonfly());
  }
  function updateDragonflies(dt) {
    const dayAmt = clamp(1 - pal.star * 1.3, 0, 1);
    for (const d of dragonflies) {
      d.dayAmt = dayAmt;
      d.retarget -= dt;
      if (d.retarget <= 0) { d.tx = rand(0, W); d.ty = rand(horizon * 0.45, H * 0.9); d.retarget = rand(0.6, 2.2); }
      const dx = d.tx - d.x, dy = d.ty - d.y, dist = Math.hypot(dx, dy) || 1, speed = 90 * d.sp;
      d.vx += ((dx / dist) * speed - d.vx) * Math.min(1, dt * 2.2);
      d.vy += ((dy / dist) * speed - d.vy) * Math.min(1, dt * 2.2);
      d.vx += wind * 16 * dt;
      d.x += d.vx * dt; d.y += d.vy * dt;
      d.flap += dt * 30;
      if (Math.abs(d.vx) > 3) d.dir = d.vx < 0 ? -1 : 1;
      d.tilt += (clamp(d.vy * 0.004, -0.5, 0.5) - d.tilt) * Math.min(1, dt * 3);
      d.y = clamp(d.y, horizon * 0.4, H * 0.92);
    }
  }
  function drawDragonfly(d) {
    if (d.dayAmt <= 0.03) return;
    const s = d.size, wing = 0.3 + 0.7 * Math.abs(Math.sin(d.flap));
    ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.tilt); ctx.scale(d.dir, 1);
    ctx.globalAlpha = d.dayAmt * 0.5;
    ctx.fillStyle = "rgba(205,235,255,0.8)";
    for (const sg of [-1, 1]) {
      ctx.beginPath(); ctx.ellipse(sg * s * 0.25, -s * 0.95, s * 1.15, s * 0.26 * wing, sg * 0.22, 0, 6.2832); ctx.fill();
      ctx.beginPath(); ctx.ellipse(sg * s * 0.2, -s * 0.55, s * 0.98, s * 0.22 * wing, sg * 0.08, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = d.dayAmt;
    const bg = ctx.createLinearGradient(0, -s * 0.3, 0, s * 1.4);
    bg.addColorStop(0, "#2e7d8a"); bg.addColorStop(1, "#17505c");
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, s * 0.7, s * 0.16, s * 1.0, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#2f8f9a";
    ctx.beginPath(); ctx.ellipse(0, -s * 0.2, s * 0.26, s * 0.4, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#17505c";
    ctx.beginPath(); ctx.arc(0, -s * 0.72, s * 0.33, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#8fe6ee";
    ctx.beginPath(); ctx.arc(-s * 0.13, -s * 0.78, s * 0.15, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(s * 0.13, -s * 0.78, s * 0.15, 0, 6.2832); ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1;
  }


  function stemPoint(f, p) {
    const sway = Math.sin(t * f.speed + f.phase) * f.amp * p * p;
    const gust = wind * f.sizeF * 26 * p * p;
    return { x: f.x + sway + gust, y: f.baseY - f.height * p };
  }

  /* ================= drawing ================= */

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgbStr(pal.top));
    g.addColorStop(0.35, rgbStr(pal.mid));
    g.addColorStop(0.62, rgbStr(lerpRgb(pal.mid, pal.h1, 0.6)));
    g.addColorStop(0.72, rgbStr(pal.h1));
    g.addColorStop(0.82, rgbStr(pal.h2));
    g.addColorStop(1, rgbStr(pal.g2));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  function drawStars() {
    if (pal.star <= 0.01) return;
    ctx.save();
    ctx.translate(parX * 0.2, parY * 0.2);
    for (const s of stars) {
      const tw = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
      ctx.globalAlpha = tw * 0.8 * pal.star;
      ctx.fillStyle = "#fff6dd";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
    }
    ctx.restore(); ctx.globalAlpha = 1;
  }

  function drawAurora(dt) {
    if (soft) return;
    if (auroraBoost > 0) auroraBoost -= dt;
    const base = clamp(pal.star * 1.1 + (auroraBoost > 0 ? 0.5 : 0), 0, 1.3);
    const a = clamp((base - 0.55) / 0.6, 0, 1);
    if (a <= 0.02) return;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const ribbons = [
      { y: horizon * 0.16, h: horizon * 0.22, col: [110, 255, 190], sp: 0.18, ph: 0.0, amp: horizon * 0.05 },
      { y: horizon * 0.24, h: horizon * 0.26, col: [90, 200, 255], sp: 0.13, ph: 2.1, amp: horizon * 0.06 },
      { y: horizon * 0.12, h: horizon * 0.18, col: [190, 130, 255], sp: 0.22, ph: 4.3, amp: horizon * 0.04 }
    ];
    for (const r of ribbons) {
      const step = 24;
      const top = [];
      for (let x = -step; x <= W + step; x += step) {
        const yy = r.y + Math.sin(x * 0.006 + t * r.sp + r.ph) * r.amp + Math.sin(x * 0.013 - t * r.sp * 0.7 + r.ph) * r.amp * 0.5;
        top.push([x, yy]);
      }
      ctx.beginPath();
      ctx.moveTo(top[0][0], top[0][1]);
      for (let i = 1; i < top.length; i++) ctx.lineTo(top[i][0], top[i][1]);
      for (let i = top.length - 1; i >= 0; i--) ctx.lineTo(top[i][0], top[i][1] + r.h);
      ctx.closePath();
      const g = ctx.createLinearGradient(0, r.y - r.amp, 0, r.y + r.h);
      g.addColorStop(0, `rgba(${r.col[0]},${r.col[1]},${r.col[2]},0)`);
      g.addColorStop(0.35, `rgba(${r.col[0]},${r.col[1]},${r.col[2]},${0.16 * a})`);
      g.addColorStop(0.7, `rgba(${r.col[0]},${r.col[1]},${r.col[2]},${0.1 * a})`);
      g.addColorStop(1, `rgba(${r.col[0]},${r.col[1]},${r.col[2]},0)`);
      ctx.fillStyle = g;
      ctx.fill();
    }
    ctx.restore();
  }

  function drawHeartConstellation() {
    const a = clamp((pal.star - 0.5) / 0.5, 0, 1);
    if (a <= 0.01) return;
    const cx = W * 0.16, cy = horizon * 0.20, s = Math.min(W, H) * 0.055;
    const pts = [];
    for (let i = 0; i < 11; i++) {
      const th = (i / 11) * Math.PI * 2;
      const x = 16 * Math.pow(Math.sin(th), 3);
      const y = 13 * Math.cos(th) - 5 * Math.cos(2 * th) - 2 * Math.cos(3 * th) - Math.cos(4 * th);
      pts.push({ x: cx + (x / 16) * s, y: cy - (y / 16) * s });
    }
    ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = a;
    ctx.strokeStyle = "rgba(255,220,160,0.28)"; ctx.lineWidth = 1;
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.closePath(); ctx.stroke();
    for (const p of pts) {
      const tw = 0.7 + 0.3 * Math.sin(t * 2 + p.x);
      ctx.fillStyle = `rgba(255,244,210,${0.95 * tw})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, 1.7, 0, 6.2832); ctx.fill();
    }
    ctx.restore(); ctx.globalAlpha = 1;
  }

  function drawNameConstellation() {
    const a = clamp((pal.star - 0.38) / 0.32, 0, 1);
    if (a <= 0.01 || !nameConst.length) return;
    const r = clamp(Math.min(W, H) * 0.014, 7, 13);
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    for (const p of nameConst) {
      const tw = 0.62 + 0.38 * Math.sin(t * 2.2 + p.tw);
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
      g.addColorStop(0, `rgba(255,238,186,${0.85 * tw * a})`); g.addColorStop(1, "rgba(255,238,186,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.2832); ctx.fill();
      ctx.fillStyle = `rgba(255,252,232,${tw * a})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.22, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
  }

  function drawMemories() {
    const a = clamp((pal.star - 0.35) / 0.4, 0, 1);
    if (a <= 0.01) return;
    for (const m of memories) {
      const pulse = 0.5 + 0.5 * Math.sin(t * 1.4 + m.ph);
      const near = Math.hypot(mouseX * W - m.x, mouseY * H - m.y) < 42;
      const s = (m.read ? 5.5 : 8) + (near ? 4 : 0) + pulse * 2;
      const col = m.read ? "255,200,150" : "255,170,200";
      ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = a * (m.read ? 0.55 : 1);
      const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, s * 3.2);
      g.addColorStop(0, `rgba(${col},0.5)`); g.addColorStop(1, `rgba(${col},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(m.x, m.y, s * 3.2, 0, 6.2832); ctx.fill();
      ctx.translate(m.x, m.y);
      drawHeartShape(s * 0.85, m.read ? "#ffd9b0" : "#ffc4da", m.read ? "#e08a4a" : "#ff6f91");
      ctx.restore();
    }
  }

  /* el avion del cartel: el "te quiero" no se escribe encima de la pantalla,
     cruza el cielo tirando de una pancarta, como los de la playa */
  let plane = null;
  function launchPlane(text) {
    const cruce = 19;                      /* segundos de punta a punta */
    plane = {
      text: text || "",
      y: horizon * 0.17,                   /* por encima del nombre en estrellas */
      x: -W * 0.62,
      vx: (W * 1.7 + W * 0.62) / cruce,
      t: 0, life: 0
    };
  }

  function updatePlane(dt) {
    if (!plane) return;
    plane.t += dt;
    plane.x += plane.vx * dt;
    plane.life = clamp(plane.t / 1.2, 0, 1);
    if (plane.x > W * 1.75) plane = null;
  }

  function drawPlane() {
    if (!plane) return;
    const p = plane;
    const fs = clamp(Math.min(W * 0.055, H * 0.032), 15, 40);
    const padX = fs * 0.85, alto = fs * 1.95;
    ctx.save();
    ctx.font = "italic " + fs + "px 'Cormorant Garamond', Georgia, serif";
    const ancho = Math.min(W * 0.82, ctx.measureText(p.text).width + padX * 2);
    const bx = p.x - fs * 1.6 - ancho;     /* la pancarta va detras */
    const onda = Math.sin(p.t * 2.1) * fs * 0.22;

    /* cuerdas */
    ctx.globalAlpha = p.life * 0.55;
    ctx.strokeStyle = "rgba(255,238,200,.6)";
    ctx.lineWidth = Math.max(1, fs * 0.05);
    ctx.beginPath();
    ctx.moveTo(p.x - fs * 0.5, p.y);
    ctx.lineTo(bx + ancho, p.y + onda - alto * 0.3);
    ctx.moveTo(p.x - fs * 0.5, p.y);
    ctx.lineTo(bx + ancho, p.y + onda + alto * 0.3);
    ctx.stroke();

    /* pancarta iluminada */
    ctx.globalAlpha = p.life;
    ctx.translate(bx + ancho / 2, p.y + onda);
    ctx.rotate(Math.sin(p.t * 2.1 + 1) * 0.035);
    const g = ctx.createLinearGradient(0, -alto / 2, 0, alto / 2);
    g.addColorStop(0, "rgba(46,32,14,.92)");
    g.addColorStop(1, "rgba(26,18,8,.92)");
    ctx.fillStyle = g;
    ctx.shadowColor = "rgba(255,200,110,.55)"; ctx.shadowBlur = fs * 1.2;
    const r = alto * 0.28;
    ctx.beginPath();
    ctx.moveTo(-ancho / 2 + r, -alto / 2);
    ctx.arcTo(ancho / 2, -alto / 2, ancho / 2, alto / 2, r);
    ctx.arcTo(ancho / 2, alto / 2, -ancho / 2, alto / 2, r);
    ctx.arcTo(-ancho / 2, alto / 2, -ancho / 2, -alto / 2, r);
    ctx.arcTo(-ancho / 2, -alto / 2, ancho / 2, -alto / 2, r);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(255,215,130,.75)"; ctx.lineWidth = Math.max(1, fs * 0.06);
    ctx.stroke();
    ctx.fillStyle = "#fff3d2";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "italic " + fs + "px 'Cormorant Garamond', Georgia, serif";
    ctx.fillText(p.text, 0, fs * 0.06);
    ctx.restore();

    /* la avioneta */
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.translate(p.x, p.y);
    const s2 = fs * 0.5;
    ctx.fillStyle = "#2b2418";
    ctx.beginPath();
    ctx.moveTo(s2 * 1.5, 0); ctx.lineTo(-s2 * 1.1, -s2 * 0.42);
    ctx.lineTo(-s2 * 1.4, 0); ctx.lineTo(-s2 * 1.1, s2 * 0.42);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(s2 * 0.1, 0); ctx.lineTo(-s2 * 0.7, -s2 * 1.15);
    ctx.lineTo(-s2 * 0.2, -s2 * 0.1); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(s2 * 0.1, 0); ctx.lineTo(-s2 * 0.7, s2 * 1.15);
    ctx.lineTo(-s2 * 0.2, s2 * 0.1); ctx.closePath(); ctx.fill();
    /* luz de posicion parpadeando */
    const par = 0.35 + 0.65 * Math.abs(Math.sin(p.t * 3.4));
    ctx.fillStyle = "rgba(255,120,90," + par + ")";
    ctx.beginPath(); ctx.arc(-s2 * 1.35, 0, Math.max(1, s2 * 0.22), 0, 6.2832); ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function spawnShootingStar() {
    const fromLeft = srand() < 0.5;
    shooting.push({
      x: fromLeft ? rand(0, W * 0.5) : rand(W * 0.5, W), y: rand(0, horizon * 0.35),
      vx: (fromLeft ? 1 : -1) * rand(220, 360), vy: rand(100, 180), life: 0, max: rand(0.9, 1.6)
    });
  }
  function drawShootingStars(dt) {
    if (pal.star > 0.5 && srand() < dt * 0.012 && shooting.length < 2) {
      for (let k = 0; k < 5; k++) spawnShootingStar();
    } else if (srand() < dt * 0.2 && shooting.length < 3) {
      spawnShootingStar();
    }
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    for (let i = shooting.length - 1; i >= 0; i--) {
      const s = shooting[i];
      s.life += dt; s.x += s.vx * dt; s.y += s.vy * dt;
      const fade = 1 - s.life / s.max;
      if (fade <= 0) { shooting.splice(i, 1); continue; }
      const tx = s.x - s.vx * 0.1, ty = s.y - s.vy * 0.1;
      const g = ctx.createLinearGradient(s.x, s.y, tx, ty);
      g.addColorStop(0, `rgba(255,248,220,${0.95 * fade})`); g.addColorStop(1, "rgba(255,248,220,0)");
      ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(tx, ty); ctx.stroke();
      const hg = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 10);
      hg.addColorStop(0, `rgba(255,250,230,${0.8 * fade})`); hg.addColorStop(1, "rgba(255,250,230,0)");
      ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(s.x, s.y, 10, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
  }

  function drawMoon() {
    const m = moonPos();
    const vis = smooth(-0.1, 0.12, m.a);
    if (vis <= 0.01) return;
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, H * 0.38);
    g.addColorStop(0, `rgba(205,218,255,${0.32 * vis})`);
    g.addColorStop(0.3, `rgba(160,185,240,${0.1 * vis})`);
    g.addColorStop(1, "rgba(160,185,240,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(m.x, m.y, H * 0.38, 0, 6.2832); ctx.fill();
    ctx.restore();
    const r = H * 0.045;
    ctx.save(); ctx.globalAlpha = vis;
    const mg = ctx.createRadialGradient(m.x - r * 0.3, m.y - r * 0.3, r * 0.1, m.x, m.y, r);
    mg.addColorStop(0, "#fdfbf0"); mg.addColorStop(0.7, "#e6e9f2"); mg.addColorStop(1, "#c6cee0");
    ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(m.x, m.y, r, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "rgba(170,180,200,0.32)";
    ctx.beginPath(); ctx.arc(m.x - r * 0.3, m.y - r * 0.1, r * 0.18, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(m.x + r * 0.25, m.y + r * 0.2, r * 0.13, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(m.x + r * 0.1, m.y - r * 0.35, r * 0.1, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  function drawSun() {
    const s = sunPos();
    const vis = smooth(-0.12, 0.1, s.a);
    if (vis <= 0.01) return;
    const c = pal.sun;
    const R = H * 0.042;
    const pulse = 1 + Math.sin(t * 0.5) * 0.02;

    const g1 = ctx.createRadialGradient(s.x, s.y, R * 0.4, s.x, s.y, H * 0.95);
    g1.addColorStop(0, rgba(c, 0.45 * vis));
    g1.addColorStop(0.1, rgba(c, 0.2 * vis));
    g1.addColorStop(0.38, rgba(c, 0.06 * vis));
    g1.addColorStop(1, rgba(c, 0));
    ctx.fillStyle = g1; ctx.beginPath(); ctx.arc(s.x, s.y, H * 0.95, 0, 6.2832); ctx.fill();

    ctx.save(); ctx.globalCompositeOperation = "lighter";
    const spikes = 26;
    for (let i = 0; i < spikes; i++) {
      const a = (i / spikes) * 6.2832 + t * 0.05;
      const len = R * (2.1 + 1.5 * Math.sin(t * 1.3 + i * 1.7));
      const w = 0.05;
      const grad = ctx.createLinearGradient(s.x, s.y, s.x + Math.cos(a) * len, s.y + Math.sin(a) * len);
      grad.addColorStop(0, rgba(c, 0.3 * vis));
      grad.addColorStop(1, rgba(c, 0));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x + Math.cos(a - w) * len, s.y + Math.sin(a - w) * len);
      ctx.lineTo(s.x + Math.cos(a + w) * len, s.y + Math.sin(a + w) * len);
      ctx.closePath(); ctx.fill();
    }
    const dg = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, R * pulse);
    dg.addColorStop(0, "rgba(255,255,255,0.98)");
    dg.addColorStop(0.45, "rgba(255,250,225,0.95)");
    dg.addColorStop(0.78, rgba(c, 0.95));
    dg.addColorStop(0.94, rgba(c, 0.7));
    dg.addColorStop(1, rgba(c, 0.1));
    ctx.globalAlpha = vis;
    ctx.fillStyle = dg; ctx.beginPath(); ctx.arc(s.x, s.y, R * pulse, 0, 6.2832); ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1;

    drawLensFlare(s.x, s.y, vis);
  }

  function drawLensFlare(sx, sy, vis) {
    if (vis < 0.25) return;
    const dx = W / 2 - sx, dy = H / 2 - sy;
    const pts = [0.28, 0.5, 0.72, 0.95, 1.25, 1.5];
    const cols = ["255,210,140", "150,210,255", "255,170,190", "170,255,200", "255,220,150", "190,190,255"];
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    pts.forEach((p, i) => {
      const x = sx + dx * p, y = sy + dy * p;
      const r = (9 + i * 6) * (H / 800);
      const a = 0.05 * vis * (1 - Math.abs(p - 0.7));
      if (a <= 0.002) return;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${cols[i]},${a})`);
      g.addColorStop(0.7, `rgba(${cols[i]},${a * 0.4})`);
      g.addColorStop(1, `rgba(${cols[i]},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    });
    ctx.restore();
  }

  function drawGodRays() {
    const s = sunPos();
    const vis = smooth(-0.05, 0.15, s.a) * pal.ray;
    if (vis <= 0.01) return;
    const len = H * 1.5;
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    const n = 7;
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (i / (n - 1) - 0.5) * 2.3 + Math.sin(t * 0.12 + i * 1.7) * 0.09;
      const spread = 0.05 + 0.025 * Math.sin(t * 0.3 + i);
      const alpha = (0.1 + 0.05 * Math.sin(t * 0.4 + i * 2.1)) * vis;
      const g = ctx.createLinearGradient(s.x, s.y, s.x + Math.cos(a) * len, s.y + Math.sin(a) * len);
      g.addColorStop(0, rgba(pal.sun, alpha)); g.addColorStop(0.5, rgba(pal.sun, alpha * 0.4)); g.addColorStop(1, rgba(pal.sun, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x + Math.cos(a - spread) * len, s.y + Math.sin(a - spread) * len);
      ctx.lineTo(s.x + Math.cos(a + spread) * len, s.y + Math.sin(a + spread) * len);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  function drawClouds(dt) {
    const sun = sunPos();
    const sunVis = clamp(sun.a * 1.6, 0, 1);
    const lit = lerpRgb([255, 255, 255], pal.sun, 0.4 * sunVis);
    const shade = lerpRgb(pal.mid, [30, 40, 60], 0.3 + 0.45 * pal.star);
    const mid = lerpRgb(lit, shade, 0.5);
    ctx.save(); ctx.translate(parX * 0.6, parY * 0.6);
    for (const c of clouds) {
      c.x += (c.sp + wind * 4) * dt;
      if (c.x > W + 320) c.x = -320;
      if (c.x < -320) c.x = W + 320;
      const sc = c.scale;
      const dx = sun.x - c.x, dy = sun.y - c.y, d = Math.hypot(dx, dy) || 1;
      const lx = dx / d, ly = dy / d;
      for (const p of c.puffs) {
        const px = c.x + p.dx * sc, py = c.y + p.dy * sc, pr = p.r * sc;
        const hx = px + lx * pr * 0.5, hy = py + ly * pr * 0.5;
        const g = ctx.createRadialGradient(hx, hy, pr * 0.05, px, py, pr);
        g.addColorStop(0, rgba(lit, 0.55 * c.a));
        g.addColorStop(0.5, rgba(mid, 0.32 * c.a));
        g.addColorStop(1, rgba(shade, 0));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(px, py, pr, 0, 6.2832); ctx.fill();
      }
    }
    ctx.restore();
  }

  /* the hills never change shape: bake them once per resize instead of
     re-tracing hundreds of points and two gradients on every frame */
  let hillsLayer = null;
  function bakeHills() {
    if (!hillsLayer) hillsLayer = document.createElement("canvas");
    hillsLayer.width = Math.max(1, Math.round(W * DPR));
    hillsLayer.height = Math.max(1, Math.round(H * DPR));
    const g2 = hillsLayer.getContext("2d");
    g2.setTransform(DPR, 0, 0, DPR, 0, 0);
    g2.clearRect(0, 0, W, H);
    for (const h of hills) {
      g2.beginPath(); g2.moveTo(-40, H);
      for (const p of h.pts) g2.lineTo(p.x, p.y);
      g2.lineTo(W + 40, H); g2.closePath();
      const g = g2.createLinearGradient(0, horizon * 0.8, 0, H);
      g.addColorStop(0, h.c1); g.addColorStop(1, h.c2);
      g2.fillStyle = g; g2.fill();
    }
  }

  function drawHills() {
    if (!hillsLayer) return;
    ctx.save(); ctx.translate(parX * 0.4, parY * 0.4);
    ctx.drawImage(hillsLayer, 0, 0, W, H);
    ctx.restore();
  }

  function drawHorizonHaze() {
    const c = pal.h2;
    const g = ctx.createLinearGradient(0, horizon - H * 0.12, 0, horizon + 10);
    g.addColorStop(0, rgba(c, 0)); g.addColorStop(0.65, rgba(c, 0.18)); g.addColorStop(1, rgba(c, 0.32));
    ctx.fillStyle = g; ctx.fillRect(0, horizon - H * 0.12, W, H * 0.12 + 10);
  }

  function drawGround() {
    const g = ctx.createLinearGradient(0, horizon, 0, H);
    g.addColorStop(0, rgbStr(pal.g1));
    g.addColorStop(0.32, rgbStr(lerpRgb(pal.g1, pal.g2, 0.6)));
    g.addColorStop(1, rgbStr(pal.g2));
    ctx.fillStyle = g; ctx.fillRect(0, horizon, W, H - horizon);
    const sunUp = clamp(sunPos().a, 0, 1);
    const r = ctx.createLinearGradient(0, horizon - 6, 0, horizon + 46);
    r.addColorStop(0, rgba(pal.sun, 0.5 * sunUp + 0.08)); r.addColorStop(1, rgba(pal.sun, 0));
    ctx.fillStyle = r; ctx.fillRect(0, horizon - 6, W, 52);
  }

  function drawGrassBlades() {
    ctx.lineCap = "round";
    for (const b of grass) {
      const sway = Math.sin(t * b.speed + b.phase) * 0.28 + wind * 0.5;
      const tipX = b.x + Math.sin(sway) * b.h * 0.5, tipY = b.baseY - b.h;
      ctx.beginPath(); ctx.moveTo(b.x, b.baseY);
      ctx.quadraticCurveTo(b.x + Math.sin(sway) * b.h * 0.2, b.baseY - b.h * 0.6, tipX, tipY);
      ctx.lineWidth = b.w; ctx.strokeStyle = b.c; ctx.stroke();
    }
  }

  function drawLeaf(f, p, side) {
    if (f.growth < p + 0.03) return;
    const pt = stemPoint(f, p), pt2 = stemPoint(f, Math.min(1, p + 0.05));
    const ang = Math.atan2(pt2.y - pt.y, pt2.x - pt.x);
    const L = f.petalLen * 0.95;
    ctx.save(); ctx.translate(pt.x, pt.y);
    ctx.rotate(ang + side * 0.95 + Math.sin(t * f.speed + f.phase) * 0.08);
    const grad = ctx.createLinearGradient(0, 0, L * side, 0);
    grad.addColorStop(0, f.stemColor); grad.addColorStop(1, "hsl(82,55%,32%)");
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(L * 0.5 * side, -L * 0.34, L * side, 0);
    ctx.quadraticCurveTo(L * 0.5 * side, L * 0.34, 0, 0);
    ctx.fill(); ctx.restore();
  }

  function buildHeadSprite(f) {
    const R = f.petalLen;
    const D = Math.max(8, Math.ceil(R * 5.2));
    const c = document.createElement("canvas");
    c.width = D; c.height = D;
    const g = c.getContext("2d");
    const cx = D / 2, cy = D / 2;
    const gl = g.createRadialGradient(cx, cy, 0, cx, cy, R * 2.3);
    gl.addColorStop(0, "rgba(255,226,132,0.34)"); gl.addColorStop(1, "rgba(255,226,132,0)");
    g.fillStyle = gl; g.beginPath(); g.arc(cx, cy, R * 2.3, 0, 6.2832); g.fill();
    const n = f.petals;
    for (let i = 0; i < n; i++) {
      const lenVar = 0.86 + 0.14 * Math.sin(i * 2.3 + f.phase);
      const a = (i / n) * 6.2832 + f.rot;
      g.save(); g.translate(cx, cy); g.rotate(a);
      const grad = g.createLinearGradient(0, 0, 0, -R * 1.15 * lenVar);
      grad.addColorStop(0, f.petalDark); grad.addColorStop(0.55, f.petalMid); grad.addColorStop(1, f.petalLight);
      g.fillStyle = grad;
      g.beginPath(); g.ellipse(0, -R * 0.62 * lenVar, f.petalW, R * 0.62 * lenVar, 0, 0, 6.2832); g.fill();
      g.restore();
    }
    const cr = f.petalW * 0.95;
    const cg = g.createRadialGradient(cx, cy, 0, cx, cy, cr * 1.4);
    cg.addColorStop(0, f.center[0]); cg.addColorStop(0.6, f.center[1]); cg.addColorStop(1, f.center[2]);
    g.fillStyle = cg; g.beginPath(); g.arc(cx, cy, cr * 1.25, 0, 6.2832); g.fill();
    g.fillStyle = "rgba(255,214,128,0.55)";
    for (const d of f.dots) {
      const rr = d.r * cr;
      g.beginPath(); g.arc(cx + Math.cos(d.a) * rr, cy + Math.sin(d.a) * rr, Math.max(0.5, cr * 0.12), 0, 6.2832); g.fill();
    }
    f.headSprite = c;
    f.headHalf = D / 2;
  }

  function drawHead(f) {
    const bloom = smooth(0.4, 1, f.growth);
    if (bloom <= 0.001) return;
    if (!f.headSprite) buildHeadSprite(f);
    const pt = stemPoint(f, f.growth);
    const tilt = Math.sin(t * f.speed + f.phase) * 0.1 + wind * f.sizeF * 0.18;
    const half = f.headHalf * bloom;
    ctx.save();
    ctx.translate(pt.x, pt.y);
    ctx.rotate(tilt);
    ctx.drawImage(f.headSprite, -half, -half, half * 2, half * 2);
    ctx.restore();
  }

  function drawFlower(f) {
    if (f.growth <= 0.001) return;
    const g = f.growth, segs = 16;
    ctx.lineCap = "round";
    for (let i = 0; i < segs; i++) {
      const p0 = (i / segs) * g, p1 = ((i + 1) / segs) * g;
      const a = stemPoint(f, p0), b = stemPoint(f, p1);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      ctx.lineWidth = Math.max(0.6, f.stemW * (1 - p0 * 0.55)); ctx.strokeStyle = f.stemColor; ctx.stroke();
    }
    drawLeaf(f, 0.36, 1); drawLeaf(f, 0.6, -1); drawHead(f);
  }

  function drawButterfly(b) {
    const perched = b.mode === "perch";
    const flap = perched ? 0.25 + 0.12 * Math.abs(Math.sin(b.flap)) : Math.abs(Math.sin(b.flap));
    const w = b.size, fh = w * (0.3 + 0.7 * flap);
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(perched ? b.tilt * 0.3 : b.tilt); ctx.scale(b.dir, 1);
    for (const s of [-1, 1]) {
      const grad = ctx.createLinearGradient(0, 0, s * w, -w);
      grad.addColorStop(0, b.c2); grad.addColorStop(1, b.c1);
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.ellipse(s * w * 0.55, -w * 0.28, w * 0.55, fh * 0.72, s * 0.5, 0, 6.2832); ctx.fill();
      ctx.beginPath(); ctx.ellipse(s * w * 0.45, w * 0.26, w * 0.42, fh * 0.55, s * 0.3, 0, 6.2832); ctx.fill();
      ctx.fillStyle = "rgba(60,40,10,0.35)";
      ctx.beginPath(); ctx.arc(s * w * 0.7, -w * 0.35, w * 0.09, 0, 6.2832); ctx.fill();
    }
    ctx.fillStyle = b.body;
    ctx.beginPath(); ctx.ellipse(0, 0, w * 0.1, w * 0.5, 0, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = b.body; ctx.lineWidth = Math.max(0.5, w * 0.06);
    ctx.beginPath();
    ctx.moveTo(0, -w * 0.4); ctx.quadraticCurveTo(w * 0.15, -w * 0.7, w * 0.25, -w * 0.8);
    ctx.moveTo(0, -w * 0.4); ctx.quadraticCurveTo(-w * 0.15, -w * 0.7, -w * 0.25, -w * 0.8);
    ctx.stroke(); ctx.restore();
  }

  function drawFallingPetals() {
    for (const p of falling) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      const grad = ctx.createLinearGradient(-p.size, 0, p.size, 0);
      grad.addColorStop(0, `hsl(${p.hue},100%,72%)`); grad.addColorStop(1, `hsl(${p.hue - 8},95%,50%)`);
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, 6.2832); ctx.fill();
      ctx.restore();
    }
  }

  function drawTrail() {
    for (const p of trail) {
      const k = 1 - p.life / p.max;
      if (k <= 0) continue;
      if (p.petal) {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.globalAlpha = k; ctx.fillStyle = `hsl(${p.hue},100%,68%)`;
        ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, 6.2832); ctx.fill();
        ctx.restore();
      } else {
        ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = k * 0.9;
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 3.5);
        g.addColorStop(0, "rgba(255,240,180,0.95)"); g.addColorStop(0.4, "rgba(255,214,110,0.4)"); g.addColorStop(1, "rgba(255,214,110,0)");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 3.5, 0, 6.2832); ctx.fill();
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawPollen() {
    for (const p of pollen) {
      const tw = 0.5 + 0.5 * Math.sin(t * p.sp + p.ph);
      ctx.globalAlpha = p.a * (0.35 + 0.65 * tw) * (0.55 + 0.45 * (1 - pal.star));
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
      g.addColorStop(0, "rgba(255,238,170,0.95)"); g.addColorStop(0.4, "rgba(255,214,110,0.4)"); g.addColorStop(1, "rgba(255,214,110,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 4, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawFireflies() {
    if (pal.fire <= 0.02) return;
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    for (const f of fireflies) {
      const pulse = Math.max(0, Math.sin(t * f.sp + f.ph)), a = pulse * pulse * pal.fire;
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 7);
      g.addColorStop(0, `hsla(${f.hue},100%,80%,${0.9 * a})`); g.addColorStop(0.35, `hsla(${f.hue},100%,62%,${0.35 * a})`); g.addColorStop(1, "rgba(180,255,120,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 7, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
  }

  function drawHeartShape(s, c1, c2) {
    const g = ctx.createLinearGradient(0, -0.7 * s, 0, 0.4 * s);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(0, 0.38 * s);
    ctx.bezierCurveTo(-0.95 * s, -0.2 * s, -0.35 * s, -0.78 * s, 0, -0.28 * s);
    ctx.bezierCurveTo(0.35 * s, -0.78 * s, 0.95 * s, -0.2 * s, 0, 0.38 * s);
    ctx.closePath(); ctx.fill();
  }

  function drawHearts() {
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    for (const h of hearts) {
      const k = clamp(Math.min(h.life / 0.6, (h.max - h.life) / 1.3), 0, 1);
      if (k <= 0) continue;
      ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(h.rot);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, h.size * 3);
      g.addColorStop(0, `rgba(255,150,190,${0.28 * k})`); g.addColorStop(1, "rgba(255,150,190,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, h.size * 3, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = k; drawHeartShape(h.size, h.c1, h.c2);
      ctx.restore();
    }
    ctx.restore(); ctx.globalAlpha = 1;
  }

  function drawBursts() {
    for (const b of bursts) {
      const k = 1 - b.life / b.max;
      if (k <= 0) continue;
      ctx.save(); ctx.globalAlpha = k; ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.fillStyle = `hsl(${b.hue},100%,68%)`;
      ctx.beginPath(); ctx.ellipse(0, 0, b.size, b.size * 0.6, 0, 0, 6.2832); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawFireworks() {
    if (!rockets.length && !sparks.length) return;
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    for (const r of rockets) {
      const g = ctx.createRadialGradient(r.x, r.y, 0, r.x, r.y, 8);
      g.addColorStop(0, `hsla(${r.hue},100%,85%,0.95)`); g.addColorStop(1, `hsla(${r.hue},100%,60%,0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(r.x, r.y, 8, 0, 6.2832); ctx.fill();
    }
    for (const s of sparks) {
      const k = 1 - s.life / s.max;
      if (k <= 0) continue;
      ctx.globalAlpha = k;
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size * 3);
      g.addColorStop(0, `hsla(${s.hue},100%,82%,0.95)`); g.addColorStop(0.4, `hsla(${s.hue},100%,60%,0.5)`); g.addColorStop(1, `hsla(${s.hue},100%,60%,0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, s.size * 3, 0, 6.2832); ctx.fill();
    }
    ctx.restore(); ctx.globalAlpha = 1;
  }

  function drawVignette() {
    const g = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.25, W / 2, H * 0.55, Math.max(W, H) * 0.8);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,0.55)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  function drawCursor(dt) {
    if (isTouch) return;
    curX += (curTX - curX) * Math.min(1, dt * 22);
    curY += (curTY - curY) * Math.min(1, dt * 22);
    if (curX < -50) return;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const g = ctx.createRadialGradient(curX, curY, 0, curX, curY, 15);
    g.addColorStop(0, "rgba(255,240,180,0.45)"); g.addColorStop(1, "rgba(255,220,120,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(curX, curY, 15, 0, 6.2832); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.translate(curX, curY); ctx.rotate(t * 0.5);
    ctx.fillStyle = "rgba(255,216,120,0.92)";
    for (let i = 0; i < 5; i++) {
      ctx.rotate(1.2566);
      ctx.beginPath(); ctx.ellipse(0, -5, 2.1, 4.4, 0, 0, 6.2832); ctx.fill();
    }
    ctx.fillStyle = "rgba(255,255,225,0.95)";
    ctx.beginPath(); ctx.arc(0, 0, 2.1, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  /* ================= update ================= */

  function updateWind(dt) {
    mouseSpeed *= Math.pow(0.85, dt * 60);
    const breeze = Math.sin(t * 0.5) * 0.35 + Math.sin(t * 1.3 + 1.7) * 0.18;
    wind += ((breeze + mouseSpeed * 2.2) - wind) * Math.min(1, dt * 3);
  }

  function updateParallax(dt) {
    parX += ((mouseX - 0.5) * -24 - parX) * Math.min(1, dt * 2);
    parY += ((mouseY - 0.5) * -12 - parY) * Math.min(1, dt * 2);
  }

  function updateDay(dt) {
    dayClock += dt * daySpeed;
    dayT = (0.12 + dayClock / DAY_LEN) % 1;
    pal = getPalette(dayT);
    if (!lanternsReleased && pal.star > 0.4) {
      lanternsReleased = true;
      for (let i = 0; i < 6; i++) spawnLantern();
    }
  }

  function updateFlowers() {
    for (const f of flowers) {
      const prev = f.growth;
      f.growth = smooth(0, 1, clamp((t - f.birth - f.delay) / 1.8, 0, 1));
      if (!f.bloomed && prev < 1 && f.growth >= 1) {
        f.bloomed = true;
        const pt = stemPoint(f, 1);
        addBurst(pt.x, pt.y, 10, 48, 70);
      }
    }
  }

  function updatePollen(dt) {
    for (const p of pollen) {
      p.x += (p.vx + wind * 0.5 + Math.sin(t * p.sp + p.ph) * 0.25) * dt * 60;
      p.y += p.vy * dt * 60;
      if (p.y < horizon * 0.4) { p.y = H + 10; p.x = rand(0, W); }
      if (p.x < -20) p.x = W + 20;
      if (p.x > W + 20) p.x = -20;
    }
  }

  function updateFireflies(dt) {
    for (const f of fireflies) {
      f.x += (f.vx + Math.sin(t * f.sp + f.ph) * 14 + wind * 18) * dt;
      f.y += (f.vy + Math.cos(t * f.sp * 1.3 + f.ph) * 10) * dt;
      if (f.x < -20) f.x = W + 20;
      if (f.x > W + 20) f.x = -20;
      if (f.y < horizon * 0.65) f.y = H - 10;
      if (f.y > H + 10) f.y = horizon * 0.65;
    }
  }

  function updateButterflies(dt) {
    for (const b of butterflies) {
      if (b.mode === "perch") {
        const f = b.perchFlower;
        if (f && f.growth > 0.4) {
          const pt = stemPoint(f, 1);
          b.x += (pt.x - b.x) * Math.min(1, dt * 6);
          b.y += (pt.y - b.size * 0.8 - b.y) * Math.min(1, dt * 6);
        }
        b.flap += dt * b.flapSp * 0.25;
        b.perchT -= dt;
        if (b.perchT <= 0) { b.mode = "fly"; b.retarget = 0; b.perchFlower = null; }
        continue;
      }
      b.retarget -= dt;
      if (b.retarget <= 0) { b.tx = rand(0, W); b.ty = rand(horizon * 0.35, H * 0.9); b.retarget = rand(2, 5); }
      const dx = b.tx - b.x, dy = b.ty - b.y, d = Math.hypot(dx, dy) || 1, speed = 48 * b.sp;
      b.vx += ((dx / d) * speed - b.vx) * Math.min(1, dt * 1.5);
      b.vy += ((dy / d) * speed - b.vy) * Math.min(1, dt * 1.5);
      b.vx += wind * 22 * dt;
      b.x += b.vx * dt; b.y += b.vy * dt; b.flap += dt * b.flapSp;
      if (Math.abs(b.vx) > 2) b.dir = b.vx < 0 ? -1 : 1;
      b.tilt += (clamp(b.vy * 0.004, -0.5, 0.5) - b.tilt) * Math.min(1, dt * 3);
      if (b.x < -40) b.x = W + 40;
      if (b.x > W + 40) b.x = -40;
      b.y = clamp(b.y, horizon * 0.28, H * 0.92);
      if (srand() < dt * 0.14 && flowers.length) {
        const f = flowers[Math.floor(srand() * flowers.length)];
        if (f.growth > 0.6) { b.perchFlower = f; b.mode = "perch"; b.perchT = rand(2.5, 6); }
      }
    }
  }

  function updateFalling(dt) {
    if (petalRainT > 0) petalRainT -= dt;
    const raining = petalRainT > 0;
    /* la misma cantidad que llena un monitor satura un movil */
    const amb = Math.round(clamp(W / 16, 24, 60));
    const cap = raining ? (soft ? 90 : 220) : (soft ? Math.round(amb * 0.45) : amb);
    const rate = raining ? (soft ? 30 : 70) : (soft ? 5 : 12);
    if (falling.length < cap && srand() < dt * rate) spawnPetal(true);
    for (const p of falling) {
      p.x += (p.vx + wind * 0.7 + Math.sin(t * p.wobSp + p.wob) * 0.5) * dt * 60;
      p.y += p.vy * dt * 60; p.rot += p.vr * dt * 60;
      if (p.y > H + 40) { p.y = rand(-60, -10); p.x = rand(-30, W + 30); }
    }
    const keep = raining ? (soft ? 100 : 240) : (soft ? 34 : 80);
    if (falling.length > keep) falling.splice(0, falling.length - keep);
  }

  function updateBursts(dt) {
    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      b.life += dt;
      if (b.life >= b.max) { bursts.splice(i, 1); continue; }
      b.vy += 90 * dt; b.vx += wind * 30 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt * 60;
    }
    if (bursts.length > 600) bursts.splice(0, bursts.length - 600);
  }

  function updateHearts(dt) {
    const maxHearts = Math.round(clamp(W / 40, 12, 34));
    if (hearts.length < (soft ? Math.round(maxHearts * 0.45) : maxHearts) && srand() < dt * (soft ? 0.3 : 0.7)) spawnHeart(rand(0, W), H + rand(0, 40));
    for (let i = hearts.length - 1; i >= 0; i--) {
      const h = hearts[i];
      h.life += dt;
      if (h.life >= h.max) { hearts.splice(i, 1); continue; }
      h.x += (h.vx + Math.sin(t * 1.5 + h.ph) * 10 + wind * 8) * dt;
      h.y += h.vy * dt; h.vy += 4 * dt; h.rot += h.vr * dt;
    }
  }

  function updateTrail(dt) {
    for (let i = trail.length - 1; i >= 0; i--) {
      const p = trail[i];
      p.life += dt;
      if (p.life >= p.max) { trail.splice(i, 1); continue; }
      p.vy += (p.petal ? 40 : 10) * dt;
      p.x += (p.vx + wind * 20) * dt;
      p.y += p.vy * dt; p.rot += p.vr * dt;
    }
  }

  function updateFireworks(dt) {
    if (fireworkQueue > 0) {
      fireworkTimer -= dt;
      if (fireworkTimer <= 0) { spawnRocket(); fireworkQueue--; fireworkTimer = rand(0.12, 0.4); }
    }
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.y += r.vy * dt; r.vy += 60 * dt;
      if (srand() < 0.85) sparks.push({ x: r.x + rand(-2, 2), y: r.y, vx: rand(-12, 12), vy: rand(0, 25), life: 0, max: rand(0.3, 0.7), size: rand(1, 2.2), hue: r.hue, grav: 30 });
      if (r.y <= r.targetY || r.vy >= 0) { explodeRocket(r); rockets.splice(i, 1); }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.life += dt;
      if (s.life >= s.max) { sparks.splice(i, 1); continue; }
      s.vy += (s.grav || 70) * dt;
      s.vx *= (1 - 0.6 * dt);
      s.x += s.vx * dt; s.y += s.vy * dt;
    }
    if (sparks.length > 900) sparks.splice(0, sparks.length - 900);
  }

  function update(dt) {
    t += dt;
    updateDay(dt); updateWind(dt); updateParallax(dt); updateFlowers();
    updatePollen(dt); updateFireflies(dt); updateButterflies(dt); updateBees(dt); updateBirds(dt); updateLadybugs(dt); updateDragonflies(dt); updateLanterns(dt);
    updateFalling(dt); updateBursts(dt); updateHearts(dt); updateTrail(dt); updateFireworks(dt);
    updatePlane(dt); updateGuion(dt);
  }

  function render(dt) {
    drawSky(); drawStars(); drawAurora(dt); drawHeartConstellation();
    drawShootingStars(dt); drawMoon(); drawSun(); drawGodRays(); drawClouds(dt);
    /* su nombre y los recuerdos van por delante de las nubes: son lo que tiene que ver */
    drawNameConstellation(); drawMemories();
    drawBirds(); drawHills(); drawHorizonHaze();
    drawGround(); drawPond(); drawGrassBlades(); drawGarland(); drawLanterns();
    for (const f of flowers) drawFlower(f);
    for (const b of ladybugs) drawLadybug(b);
    for (const b of butterflies) drawButterfly(b);
    for (const b of bees) drawBee(b);
    for (const d of dragonflies) drawDragonfly(d);
    drawPlane();
    drawFallingPetals(); drawTrail(); drawPollen(); drawFireflies(); drawHearts(); drawBursts(); drawFireworks(); drawVignette(); drawCursor(dt);
  }

  /* ================= music ================= */

  let actx = null, master = null, volGain = null, delayNode = null, musicOn = false, step = 0, nextNoteTime = 0, cricketNext = 0;
  let volume = 0.6;
  let musicPref = true;
  try { musicPref = localStorage.getItem("floresMusic") !== "0"; } catch (e) {}
  const musicBtn = document.getElementById("music");

  function initAudio() {
    if (actx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain(); master.gain.value = 0;
    volGain = actx.createGain(); volGain.gain.value = volume;
    master.connect(volGain); volGain.connect(actx.destination);
    delayNode = actx.createDelay(1.0); delayNode.delayTime.value = 0.32;
    const fb = actx.createGain(); fb.gain.value = 0.32;
    delayNode.connect(fb); fb.connect(delayNode); delayNode.connect(master);
  }

  function playNote(freq, time, dur, vol, type) {
    if (!actx) return;
    const o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
    o.type = type || "triangle"; o.frequency.setValueAtTime(freq, time);
    f.type = "lowpass"; f.frequency.value = 2000; f.Q.value = 0.6;
    o.connect(f); f.connect(g); g.connect(master); g.connect(delayNode);
    g.gain.setValueAtTime(0.0001, time);
    g.gain.linearRampToValueAtTime(vol, time + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    o.start(time); o.stop(time + dur + 0.1);
  }

  let noiseBuf = null;
  function makeNoise() {
    const len = Math.floor(actx.sampleRate * 0.4);
    noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = srand() * 2 - 1;
  }
  function playCricket(time) {
    if (!actx || !noiseBuf) return;
    const src = actx.createBufferSource(); src.buffer = noiseBuf;
    const bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = rand(3800, 5200); bp.Q.value = 9;
    const g = actx.createGain(); src.connect(bp); bp.connect(g); g.connect(master);
    g.gain.setValueAtTime(0, time);
    for (let i = 0; i < 3; i++) {
      g.gain.linearRampToValueAtTime(0.012, time + i * 0.06 + 0.005);
      g.gain.linearRampToValueAtTime(0, time + i * 0.06 + 0.035);
    }
    src.start(time); src.stop(time + 0.3);
  }

  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];
  const noteFreq = (semi) => 261.63 * Math.pow(2, semi / 12);

  function scheduleStep(time) {
    const night = pal && pal.star > 0.5;
    playNote(noteFreq(PENTA[Math.floor(srand() * PENTA.length)] - (night ? 12 : 0)), time, rand(1.4, 2.6), 0.08, "triangle");
    if (srand() < 0.45) playNote(noteFreq(PENTA[Math.floor(srand() * PENTA.length)] + 12), time + 0.22, rand(0.8, 1.4), 0.04, "sine");
    if (step % 8 === 0) playNote(noteFreq(-12), time, 3.4, 0.06, "sine");
    step++;
  }

  setInterval(() => {
    if (!actx || !musicOn) return;
    const lookahead = actx.currentTime + 0.4;
    while (nextNoteTime < lookahead) { scheduleStep(nextNoteTime); nextNoteTime += 0.48; }
    if (pal && pal.star > 0.6 && actx.currentTime > cricketNext) {
      playCricket(actx.currentTime + 0.05);
      cricketNext = actx.currentTime + rand(0.5, 1.5);
    }
  }, 120);

  function setMusic(on) {
    initAudio();
    if (!actx) return;
    if (actx.state === "suspended") actx.resume();
    if (!noiseBuf) makeNoise();
    musicOn = on;
    if (on) {
      nextNoteTime = Math.max(nextNoteTime, actx.currentTime + 0.05);
      master.gain.cancelScheduledValues(actx.currentTime);
      master.gain.setValueAtTime(Math.max(0.0001, master.gain.value), actx.currentTime);
      master.gain.linearRampToValueAtTime(0.45, actx.currentTime + 2.5);
    } else {
      master.gain.cancelScheduledValues(actx.currentTime);
      master.gain.setValueAtTime(master.gain.value, actx.currentTime);
      master.gain.linearRampToValueAtTime(0.0001, actx.currentTime + 1.0);
    }
    musicBtn.classList.toggle("on", on);
    musicBtn.setAttribute("aria-checked", on ? "true" : "false");
    try { localStorage.setItem("floresMusic", on ? "1" : "0"); } catch (e) {}
  }

  function playChime() {
    if (!actx) return;
    const now = actx.currentTime + 0.02;
    [0, 4, 7, 12, 16, 19].forEach((n, i) => playNote(noteFreq(n), now + i * 0.12, 2.6, 0.07, "sine"));
  }

  function plantSound() {
    if (!actx || !musicOn) return;
    const now = actx.currentTime + 0.01;
    playNote(noteFreq(PENTA[Math.floor(srand() * PENTA.length)] + 12), now, 0.9, 0.045, "sine");
  }

  musicBtn.addEventListener("pointerdown", e => e.stopPropagation());
  musicBtn.addEventListener("click", e => { e.stopPropagation(); setMusic(!musicOn); });

  const volumeEl = document.getElementById("volume");
  try {
    const sv = localStorage.getItem("floresVolume");
    if (sv !== null) { volume = clamp(parseFloat(sv), 0, 1); volumeEl.value = Math.round(volume * 100); }
  } catch (e) {}
  volumeEl.addEventListener("pointerdown", e => e.stopPropagation());
  volumeEl.addEventListener("input", () => {
    volume = volumeEl.value / 100;
    if (actx && volGain) volGain.gain.setTargetAtTime(volume, actx.currentTime, 0.05);
    try { localStorage.setItem("floresVolume", String(volume)); } catch (e) {}
  });

  /* ================= toast / letter / card ================= */

  /* Una sola voz: todo lo que la web le dice pasa por aqui, de uno en uno
     y siempre en el mismo sitio. Antes habia dos canales (pistas abajo,
     avisos arriba) que se pisaban entre ellos. */
  const MSG_GAP = 800;
  /* un mensaje largo necesita mas tiempo que uno corto para leerse */
  const msgDuration = m => clamp(2800 + m.length * 55, 3800, 7400);
  let toastTimer = null, gapTimer = null, pendingToast = null, panelOpen = false;
  let msgQueue = [], showingMsg = false, showingHint = false;
  /* storyMsg es la linea del acto en curso: se queda mientras le toca a ella
     hacer algo. Los avisos sueltos pasan por delante y luego vuelve. */
  let storyMsg = null, showingStory = false, storyAbajo = false;
  const toastEl = document.getElementById("toast");

  function dialogOpen() {
    return panelOpen || lovesEl.classList.contains("show") || closingEl.classList.contains("show") || (dedEl.classList.contains("show") && !dedEl.classList.contains("hidden")) || letterEl.classList.contains("show") || cardEl.classList.contains("show");
  }

  function presentMsg(msg, isHint) {
    showingMsg = true;
    showingHint = !!isHint;
    showingStory = false;
    toastEl.classList.remove("story");
    toastEl.classList.toggle("abajo", storyAbajo);
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toastEl.classList.remove("show");
      showingMsg = false;
      clearTimeout(gapTimer);
      gapTimer = setTimeout(nextMsg, MSG_GAP);
    }, msgDuration(msg));
  }

  function presentStory() {
    if (!storyMsg || dialogOpen()) return;
    clearTimeout(toastTimer); clearTimeout(gapTimer);
    showingMsg = false; showingHint = false; showingStory = true;
    toastEl.textContent = storyMsg;
    toastEl.classList.toggle("abajo", storyAbajo);
    toastEl.classList.add("show", "story");
  }

  function setStory(msg, abajo) {
    storyMsg = msg;
    storyAbajo = !!abajo;
    if (!showingMsg) presentStory();
  }

  function clearStory() {
    storyMsg = null;
    storyAbajo = false;

    if (showingStory) { presentMsg(msg, isHint); return; }   /* la linea del acto cede y vuelve */
    if (showingMsg) {
      if (isHint) return;                                   /* las pistas no hacen cola */
      if (showingHint) { presentMsg(msg, false); return; }  /* una pista cede su turno */
      if (msgQueue[msgQueue.length - 1] !== msg) msgQueue.push(msg);
      if (msgQueue.length > 2) msgQueue.splice(0, msgQueue.length - 2);
      return;

    presentMsg(msg, isHint);

  let builtW = 0, builtH = 0, resizeTimer = null;

  function resize(force) {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    if (force !== true && w === builtW && h === builtH) return;
    builtW = w; builtH = h;
    W = w; H = h;
    applyBacking();
    horizon = H * 0.74;
    build();
  }

  function applyBacking() {
    DPR = Math.min(window.devicePixelRatio || 1, soft ? 1.25 : 2);
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  /* switching quality also switches pixel density, not only the crowd counts */
  function applyQuality() {
    applyBacking();
    build();
  }

  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 150);
  });
  window.addEventListener("orientationchange", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => resize(true), 250);
  });

  pal = getPalette(dayT);
  buildDedication();
  buildLetter();
  document.getElementById("introSub").textContent = GIFT.paraTi || ("para " + GIFT.para);
  loadGarden();
  returning = flowersPlanted > 0;
  /* ?libre salta el guion; tambien se salta si ya lo vivio entero otro dia */
  if (guionVisto || /(^|[?&#])libre/.test(location.search + location.hash)) goFree();
  /* el guion empieza siempre con el campo desnudo: las flores son las que
     ella plante. Asi no arranca sobre un muro de flores de otra sesion. */
  if (!freeMode) { plantedSpots = []; flowersPlanted = 0; milestoneIdx = 0; }
  updateChip();
  resize();
  requestAnimationFrame(loop);

  const introEl = document.getElementById("intro");
  const introBtn = document.getElementById("introBtn");
  let started = false;
  /* las de base crecian solas detras de la intro y las ya plantadas aparecian
     hechas: ahora el jardin entero florece de una vez, justo al entrar ella */
  function bloomAll() {
    for (const f of flowers) {
      f.birth = t;
      f.delay = 0.25 + (f.x / (W || 1)) * 1.15 + rand(0, 0.4);
      f.growth = 0;
      f.bloomed = false;
    }
  }

  function startExperience() {
    if (started || !gateOpen) return;
    started = true;
    bloomAll();
    introEl.classList.add("hide");
    setTimeout(() => { if (introEl.parentNode) introEl.remove(); }, 1700);
    setMusic(musicPref);
    setTimeout(reveal, 1200);
  }
  introEl.addEventListener("pointerdown", e => e.stopPropagation());
  introEl.addEventListener("click", startExperience);
  introBtn.addEventListener("pointerdown", e => e.stopPropagation());
  introBtn.addEventListener("click", e => { e.stopPropagation(); startExperience(); });

  const intensityBtn = document.getElementById("intensity");
  intensityBtn.classList.toggle("on", soft);
  intensityBtn.setAttribute("aria-checked", soft ? "true" : "false");
  intensityBtn.addEventListener("pointerdown", e => e.stopPropagation());
  intensityBtn.addEventListener("click", e => {
    e.stopPropagation();
    soft = !soft;
    autoSoftDone = true;
    intensityBtn.classList.toggle("on", soft);
    intensityBtn.setAttribute("aria-checked", soft ? "true" : "false");
    applyQuality();
  });

  const settingsBtn = document.getElementById("settings");
  const panelEl = document.getElementById("panel");
  function setPanel(open) {
    panelOpen = open;
    if (!open) disarmReset();
    panelEl.classList.toggle("open", open);
    settingsBtn.classList.toggle("on", open);
    settingsBtn.setAttribute("aria-expanded", open ? "true" : "false");
    if (open) hideMsgNow(true);
    else flushToast();
  }
  settingsBtn.addEventListener("pointerdown", e => e.stopPropagation());
  settingsBtn.addEventListener("click", e => { e.stopPropagation(); setPanel(!panelEl.classList.contains("open")); });
  panelEl.addEventListener("pointerdown", e => e.stopPropagation());
  document.addEventListener("pointerdown", e => {
    if (panelEl.classList.contains("open") && !panelEl.contains(e.target) && !settingsBtn.contains(e.target)) setPanel(false);
  });

  /* save a still of the garden, caption included */
  const snapBtn = document.getElementById("snap");
  function snapshot() {
    let out;
    try {
      out = document.createElement("canvas");
      out.width = canvas.width; out.height = canvas.height;
      const g = out.getContext("2d");
      g.drawImage(canvas, 0, 0);
      g.setTransform(DPR, 0, 0, DPR, 0, 0);
      const band = g.createLinearGradient(0, H - 170, 0, H);
      band.addColorStop(0, "rgba(4,7,14,0)");
      band.addColorStop(1, "rgba(4,7,14,.72)");
      g.fillStyle = band; g.fillRect(0, H - 170, W, 170);
      g.textAlign = "center";
      g.fillStyle = "rgba(255,238,196,.96)";
      g.font = "italic " + Math.round(clamp(W * 0.036, 20, 40)) + "px 'Cormorant Garamond', Georgia, serif";
      g.fillText(GIFT.titulo + ", " + GIFT.para, W / 2, H - 62);
      g.fillStyle = "rgba(255,220,150,.82)";
      g.font = Math.round(clamp(W * 0.018, 12, 19)) + "px 'Cormorant Garamond', Georgia, serif";
      g.fillText(GIFT.fecha, W / 2, H - 32);
    } catch (e) {
      setPanel(false);
      showToast("no pude guardar la imagen en este navegador");
      return;
    }
    const name = "flores-amarillas-" + new Date().toISOString().slice(0, 10) + ".png";
    const save = (url, revoke) => {
      const a = document.createElement("a");
      a.href = url; a.download = name; a.rel = "noopener";
      document.body.appendChild(a); a.click(); a.remove();
      if (revoke) setTimeout(() => URL.revokeObjectURL(url), 8000);
      setPanel(false);
      showToast("guardé una foto de tu jardín");
    };
    if (out.toBlob) {
      out.toBlob(b => {
        if (b) save(URL.createObjectURL(b), true);
        else { setPanel(false); showToast("no pude guardar la imagen en este navegador"); }
      }, "image/png");
    } else {
      save(out.toDataURL("image/png"), false);
    }
  }
  snapBtn.addEventListener("pointerdown", e => e.stopPropagation());
  snapBtn.addEventListener("click", e => { e.stopPropagation(); snapshot(); });

  /* planted flowers persist forever; let her start the garden over */
  const resetBtn = document.getElementById("reset");
  const resetLabel = document.getElementById("resetLabel");
  let resetArmed = false, resetTimer = null;
  function disarmReset() {
    clearTimeout(resetTimer);
    resetArmed = false;
    resetBtn.classList.remove("on");
    resetLabel.textContent = "reiniciar jardín";
  }
  function resetGarden() {
    if (!resetArmed) {
      resetArmed = true;
      resetBtn.classList.add("on");
      resetLabel.textContent = "¿seguro? toca otra vez";
      resetTimer = setTimeout(disarmReset, 5000);
      return;
    }
    disarmReset();
    plantedSpots = []; flowersPlanted = 0; milestoneIdx = 0;
    /* reiniciar es empezar de cero de verdad: tambien vuelve el guion */
    try { localStorage.removeItem("floresGarden"); localStorage.removeItem("floresGuion"); } catch (e) {}
    build();
    updateChip();
    setPanel(false);
    showToast("el jardín vuelve a empezar...");
    setTimeout(() => location.reload(), 1900);
  }
  resetBtn.addEventListener("pointerdown", e => e.stopPropagation());
  resetBtn.addEventListener("click", e => { e.stopPropagation(); resetGarden(); });

  const surpriseBtn = document.getElementById("surprise");
  surpriseBtn.addEventListener("pointerdown", e => e.stopPropagation());
  surpriseBtn.addEventListener("click", e => { e.stopPropagation(); surpriseBtn.classList.add("used"); surprise(); });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      if (actx && musicOn && actx.state === "running") actx.suspend();
    } else {
      last = performance.now();
      frameSamples = 0; frameAcc = 0;
      if (actx && musicOn && actx.state === "suspended") actx.resume();
    }
  });
})();
</script>
</body>
</html>
