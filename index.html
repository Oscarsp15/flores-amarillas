<style>
  :root { --gold:#ffd77a; --gold2:#ffe9b0; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #050d18;
    overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
  }
  canvas {
    display: block; width: 100%; height: 100vh; height: 100dvh;
    cursor: crosshair; touch-action: none;
  }
  body { font-family: 'Cormorant Garamond', Georgia, serif; }

  .noscript-note {
    position: fixed; inset: 0; z-index: 30; display: grid; place-content: center;
    text-align: center; padding: 28px; background: #0a1224; color: #ffe9b0;
    font-family: 'Cormorant Garamond', Georgia, serif; font-size: 19px; line-height: 1.7;
  }

  .settings {
    position: fixed; top: 16px; right: 16px; z-index: 12;
    width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(255,220,150,.4); background: rgba(20,14,6,.45); color: var(--gold);
    display: grid; place-items: center;
    -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
    transition: all .35s ease;
  }
  .settings:hover { background: rgba(255,215,120,.15); }
  .settings.on { color: #fff4cf; box-shadow: 0 0 20px rgba(255,215,120,.5); }

  .panel {
    position: fixed; top: 70px; right: 16px; z-index: 12; width: 216px;
    padding: 8px 14px; border-radius: 14px;
    background: rgba(14,12,8,.82); border: 1px solid rgba(255,220,150,.3);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    box-shadow: 0 18px 50px rgba(0,0,0,.55);
    opacity: 0; pointer-events: none; transform: translateY(-8px);
    transition: opacity .3s ease, transform .3s ease;
  }
  .panel.open { opacity: 1; pointer-events: auto; transform: none; }
  .prow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 2px; color: rgba(255,236,190,.9); font-size: 15px; }
  .prow + .prow { border-top: 1px solid rgba(255,220,150,.12); }
  .switch, .pbtn {
    width: 42px; height: 26px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(255,220,150,.35); background: rgba(255,255,255,.06); color: rgba(255,236,190,.7);
    display: grid; place-items: center; transition: all .3s ease; font-family: inherit; font-size: 15px;
  }
  .switch.on, .pbtn.on { background: rgba(255,215,120,.28); color: #fff4cf; box-shadow: 0 0 14px rgba(255,215,120,.5); }
  .pbtn:hover { background: rgba(255,215,120,.18); color: #fff4cf; }
  .pbtn:active { transform: scale(.92); }
  .pbtn[disabled] { opacity: .4; cursor: default; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,215,120,0); }
    50% { box-shadow: 0 0 16px 2px rgba(255,215,120,.35); }
  }

  .days {
    position: fixed; left: 16px; top: 16px; z-index: 7; display: none;
    padding: 9px 16px; border-radius: 999px;
    border: 1px solid rgba(255,220,150,.3); background: rgba(20,14,6,.4);
    color: rgba(255,225,160,.85); font-size: 14px; letter-spacing: .6px;
    -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
  }
  .days.show { display: block; }

  .letter-btn {
    position: fixed; left: 16px; bottom: 16px; z-index: 7;
    padding: 11px 22px; border-radius: 999px;
    border: 1px solid rgba(255,220,150,.45);
    background: rgba(20,14,6,.45); color: var(--gold);
    font-family: inherit; font-size: 16px; letter-spacing: 1px; cursor: pointer;
    -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
    transition: all .35s ease;
  }
  .letter-btn:hover { background: rgba(255,215,120,.16); border-color: rgba(255,220,150,.9); }
  .letter-btn.off { opacity: 0; pointer-events: none; }

  .toast {
    position: fixed; left: 50%; top: 28px; transform: translate(-50%, -12px); z-index: 11;
    padding: 12px 24px; border-radius: 999px; max-width: 88vw; text-align: center;
    background: rgba(20,14,6,.75); border: 1px solid rgba(255,220,150,.4);
    color: #ffe9b0; font-size: 17px; letter-spacing: .4px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    opacity: 0; pointer-events: none; transition: opacity .5s ease, transform .5s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  /* la linea que dirige es mas sobria; los avisos sueltos destacan sobre ella */
  .toast.story { background: rgba(14,12,8,.6); border-color: rgba(255,220,150,.28); color: rgba(255,238,200,.92); }
  /* si le pedimos que mire al cielo, el texto se quita de en medio */
  .toast.abajo { top: auto; bottom: 104px; }

  .dedication {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
    opacity: 0; transition: opacity 2.2s ease;
    /* sin este velo el texto se pierde sobre un campo lleno de flores */
    background: radial-gradient(ellipse 88% 66% at 50% 48%,
      rgba(3,6,12,.86) 0%, rgba(3,6,12,.78) 38%, rgba(3,6,12,.5) 66%, rgba(3,6,12,.12) 88%, rgba(3,6,12,0) 100%);
  }
  .dedication.show { opacity: 1; }
  .dedication.hidden { opacity: 0; }
  .ded-inner { max-width: 660px; transform: translateY(20px) scale(.98); transition: transform 2.4s cubic-bezier(.2,.8,.2,1); }
  .dedication.show .ded-inner { transform: none; }
  .ded-date, .ded-title, .ded-name, .ded-line, .ded-sign, .ded-close {
    opacity: 0; transform: translateY(16px);
    transition: opacity 1.5s ease, transform 1.5s ease;
  }
  .dedication.show .ded-date, .dedication.show .ded-title, .dedication.show .ded-name,
  .dedication.show .ded-line, .dedication.show .ded-sign, .dedication.show .ded-close { opacity: 1; transform: none; }
  .ded-date { font-size: clamp(13px, 4vw, 17px); letter-spacing: clamp(3px, 1.6vw, 7px); text-transform: uppercase; color: rgba(255,220,150,.85); margin-bottom: 14px; transition-delay: .2s; text-shadow: 0 2px 14px rgba(0,0,0,.9); }
  .ded-title {
    font-size: clamp(28px, 6vw, 56px); font-weight: 600; margin: 0 0 4px; letter-spacing: .5px;
    background: linear-gradient(180deg, #fff7db, #ffd06a 55%, #e9a23a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 26px rgba(255,200,90,.35)); transition-delay: .5s;
  }
  .ded-name {
    font-family: 'Great Vibes', 'Segoe Script', cursive;
    font-size: clamp(36px, 9vw, 76px); color: #ffe9b0; margin: 4px 0 20px; line-height: 1.1;
    text-shadow: 0 0 24px rgba(255,205,100,.6), 0 0 60px rgba(255,180,70,.35); transition-delay: .9s;
  }
  .ded-line { font-size: clamp(16px, 4.6vw, 21px); color: rgba(255,246,224,.95); margin: 7px 0; font-weight: 300; letter-spacing: .4px; text-shadow: 0 2px 16px rgba(0,0,0,.92), 0 0 34px rgba(0,0,0,.6); }
  .ded-sign { margin-top: 24px; font-size: clamp(16px, 4.6vw, 20px); color: rgba(255,225,165,.95); font-style: italic; transition-delay: 1.6s; text-shadow: 0 2px 16px rgba(0,0,0,.92), 0 0 34px rgba(0,0,0,.6); }
  .ded-close {
    pointer-events: auto; margin-top: 28px;
    background: rgba(14,11,6,.72); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    box-shadow: 0 10px 34px rgba(0,0,0,.55);
    border: 1px solid rgba(255,220,150,.7); color: #ffeec4;
    padding: 10px 24px; border-radius: 999px; font-family: inherit;
    font-size: 15px; letter-spacing: 1.2px; cursor: pointer; transition: all .35s ease; transition-delay: 2s;
  }
  .ded-close:hover { background: rgba(255,215,120,.14); border-color: rgba(255,220,150,.9); }

  .letter, .card {
    position: fixed; inset: 0; z-index: 13; display: flex; align-items: center; justify-content: center;
    padding: 20px; opacity: 0; pointer-events: none; background: rgba(4,6,12,0);
    transition: opacity .6s ease, background .6s ease;
  }
  .letter.show, .card.show { opacity: 1; pointer-events: auto; background: rgba(4,6,12,.6); }
  .letter-paper, .card-paper {
    width: min(580px, 92vw); max-height: 84vh; overflow: auto; border-radius: 16px;
    padding: 34px 32px 24px;
    background: linear-gradient(160deg, #fdf6e3, #f3e3bd);
    box-shadow: 0 30px 90px rgba(0,0,0,.65), inset 0 0 70px rgba(180,140,70,.18);
    border: 1px solid rgba(150,110,50,.35);
    transform: translateY(18px) scale(.97); transition: transform .6s cubic-bezier(.2,.8,.2,1);
  }
  .letter.show .letter-paper, .card.show .card-paper { transform: none; }
  .letter-head, .card-title { font-family: 'Great Vibes', cursive; font-size: 38px; color: #7a4a12; text-align: center; margin-bottom: 16px; }
  .letter-body, .card-body { font-size: 19px; line-height: 1.75; color: #4a3418; white-space: pre-wrap; min-height: 150px; opacity: 0; transition: opacity .35s ease, transform .35s ease; }
  .letter-paper.turning { animation: paperFlip .5s ease; }
  @keyframes paperFlip {
    0% { box-shadow: 0 30px 90px rgba(0,0,0,.65), inset 0 0 70px rgba(180,140,70,.18); }
    50% { box-shadow: 0 30px 90px rgba(0,0,0,.85), inset -34px 0 60px rgba(120,90,40,.38); }
    100% { box-shadow: 0 30px 90px rgba(0,0,0,.65), inset 0 0 70px rgba(180,140,70,.18); }
  }
  .letter-nav { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 24px; }
  .letter-nav button {
    width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(150,110,50,.45); background: rgba(255,255,255,.35);
    color: #7a4a12; font-size: 20px; line-height: 1; transition: all .3s;
  }
  .letter-nav button:hover { background: rgba(184,121,31,.18); }
  .dots { display: flex; gap: 8px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(122,74,18,.28); cursor: pointer; transition: all .3s; }
  .dots i.active { background: #b8791f; transform: scale(1.3); }
  .letter-close, .card-close {
    display: block; margin: 20px auto 0; padding: 9px 22px; border-radius: 999px;
    border: 1px solid rgba(150,110,50,.45); background: transparent; color: #7a4a12;
    font-family: inherit; font-size: 15px; letter-spacing: 1px; cursor: pointer; transition: all .3s;
  }
  .letter-close:hover, .card-close:hover { background: rgba(184,121,31,.14); }

  .loves {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0; transition: opacity 2.6s ease; text-align: center; padding: 24px;
    background: radial-gradient(ellipse 85% 55% at 50% 50%,
      rgba(3,6,12,.76) 0%, rgba(3,6,12,.6) 42%, rgba(3,6,12,.22) 74%, rgba(3,6,12,0) 100%);
  }
  .loves.show { opacity: 1; }
  .loves span {
    font-family: 'Great Vibes', 'Segoe Script', cursive;
    font-size: clamp(46px, 13vw, 140px); line-height: 1.05; color: #fff3cf;
    text-shadow: 0 0 28px rgba(255,205,105,.9), 0 0 70px rgba(255,155,60,.6), 0 0 140px rgba(255,120,40,.4);
    transform: translateY(22px) scale(.93); transition: transform 3s cubic-bezier(.2,.8,.2,1);
    animation: loveGlow 3.6s ease-in-out infinite;
  }
  .loves.show span { transform: none; }
  @keyframes loveGlow {
    0%, 100% { text-shadow: 0 0 28px rgba(255,205,105,.8), 0 0 70px rgba(255,155,60,.5), 0 0 140px rgba(255,120,40,.3); }
    50% { text-shadow: 0 0 40px rgba(255,215,130,1), 0 0 100px rgba(255,165,70,.75), 0 0 180px rgba(255,130,50,.5); }
  }

  .closing {
    position: fixed; left: 50%; bottom: 28%; transform: translate(-50%, 10px); z-index: 11;
    max-width: 88vw;
    pointer-events: none; text-align: center; font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic; font-size: clamp(18px, 5vw, 30px); color: rgba(255,242,210,.95);
    padding: 10px 22px; border-radius: 999px; background: rgba(6,8,14,.5);
    -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
    text-shadow: 0 0 20px rgba(255,190,90,.6), 0 2px 14px rgba(0,0,0,.9);
    opacity: 0; transition: opacity 2s ease, transform 2s ease;
  }
  .closing.show { opacity: 1; transform: translate(-50%, 0); }

  .endbar {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 7;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 92vw;
    opacity: 0; pointer-events: none; transition: opacity 1.2s ease;
  }
  .endbar.show { opacity: 1; pointer-events: auto; }
  .replay {
    padding: 11px 22px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(255,220,150,.45); background: rgba(20,14,6,.55); color: var(--gold);
    font-family: inherit; font-size: 15px; letter-spacing: 1px;
    -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
    transition: background .3s ease, border-color .3s ease;
  }
  .replay:hover { background: rgba(255,215,120,.16); border-color: rgba(255,220,150,.9); }

  .letter-btn.beat { animation: letterBeat 2.6s ease-in-out infinite; }
  @keyframes letterBeat {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,215,120,0); }
    50% { box-shadow: 0 0 18px 3px rgba(255,215,120,.5); }
  }

  .gate {
    position: fixed; inset: 0; z-index: 25; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; opacity: 1; transition: opacity 1.6s ease;
    background: radial-gradient(120% 100% at 50% 38%, #16294a 0%, #0a1224 55%, #05080f 100%);
  }
  .gate[hidden] { display: none; }
  .gate.hide { opacity: 0; pointer-events: none; }
  .gate-inner { animation: introIn 1.6s ease both; max-width: 560px; }
  .gate .flower { width: 54px; height: 54px; margin-bottom: 12px; filter: drop-shadow(0 0 18px rgba(255,205,100,.55)); animation: gateSpin 26s linear infinite; }
  @keyframes gateSpin { to { transform: rotate(360deg); } }
  .gate-title { font-family: 'Great Vibes', cursive; font-size: clamp(38px, 11vw, 82px); color: #ffe9b0; line-height: 1.05; text-shadow: 0 0 30px rgba(255,205,100,.5), 0 0 80px rgba(255,170,70,.3); }
  .gate-sub { font-size: clamp(12px, 3.4vw, 16px); letter-spacing: 5px; text-transform: uppercase; color: rgba(255,235,190,.7); margin-top: 8px; }
  .count { display: flex; justify-content: center; gap: clamp(8px, 2.5vw, 16px); margin-top: clamp(26px, 6vw, 40px); }
  .cbox[hidden] { display: none; }
  .cbox {
    min-width: clamp(58px, 17vw, 82px); padding: 12px 8px; border-radius: 16px;
    border: 1px solid rgba(255,220,150,.28); background: rgba(20,14,6,.45);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .cnum { font-size: clamp(24px, 7vw, 40px); color: #ffe9b0; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .clab { font-size: clamp(9px, 2.4vw, 11px); letter-spacing: 2px; text-transform: uppercase; color: rgba(255,235,190,.55); margin-top: 6px; }
  .gate-note { margin: clamp(24px, 6vw, 34px) 0 0; font-size: clamp(15px, 4vw, 19px); font-style: italic; color: rgba(255,235,190,.78); line-height: 1.6; }
  .gate-soon { margin: 10px 0 0; font-size: clamp(13px, 3.4vw, 15px); color: rgba(255,220,150,.55); letter-spacing: .5px; }

  .intro {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; opacity: 1; transition: opacity 1.4s ease;
    background: radial-gradient(120% 100% at 50% 38%, #16294a 0%, #0a1224 55%, #05080f 100%);
  }
  .intro.hide { opacity: 0; pointer-events: none; }
  .intro-inner { animation: introIn 1.6s ease both; }
  @keyframes introIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .intro .flower { width: 60px; height: 60px; margin-bottom: 14px; filter: drop-shadow(0 0 18px rgba(255,205,100,.55)); }
  .intro-title { font-family: 'Great Vibes', cursive; font-size: clamp(46px, 13vw, 104px); color: #ffe9b0; line-height: 1.05; text-shadow: 0 0 30px rgba(255,205,100,.5), 0 0 80px rgba(255,170,70,.3); }
  .intro-sub { font-size: clamp(13px, 3.6vw, 17px); letter-spacing: 5px; text-transform: uppercase; color: rgba(255,235,190,.7); margin-top: 10px; }
  .intro-btn {
    margin-top: 34px; padding: 13px 30px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(255,220,150,.5); background: rgba(255,215,120,.08); color: #ffe9b0;
    font-family: inherit; font-size: 17px; letter-spacing: 1px; transition: all .35s ease;
    animation: pulse 2.8s ease-in-out infinite;
  }
  .intro-btn:hover { background: rgba(255,215,120,.18); border-color: rgba(255,220,150,.9); }

  .volume {
    -webkit-appearance: none; appearance: none; width: 100px; height: 4px;
    background: rgba(255,220,150,.25); border-radius: 999px; outline: none; cursor: pointer;
  }
  .volume::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
    background: var(--gold); box-shadow: 0 0 10px rgba(255,215,120,.6); cursor: pointer;
  }
  .volume::-moz-range-thumb { width: 16px; height: 16px; border: none; border-radius: 50%; background: var(--gold); cursor: pointer; }

  .surprise {
    position: fixed; right: 16px; bottom: 16px; z-index: 7;
    width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(255,220,150,.4); background: rgba(20,14,6,.45); color: var(--gold);
    display: grid; place-items: center;
    -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
    transition: all .3s ease;
  }
  .surprise:hover { background: rgba(255,215,120,.16); }
  .surprise:active { transform: scale(.9); }
  .surprise:not(.used) { animation: pulse 3s ease-in-out infinite; }
  .surprise.off { opacity: 0; pointer-events: none; transform: scale(.8); }

  @media (hover: hover) and (pointer: fine) {
    canvas { cursor: none; }
  }

  button:focus-visible, .dots i:focus-visible, .volume:focus-visible {
    outline: 2px solid rgba(255,225,160,.9); outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .intro-btn, .letter-btn.beat, .surprise:not(.used), .loves span, .gate .flower { animation: none; }
    .letter-paper.turning { animation: none; }
    .dedication, .ded-inner, .ded-date, .ded-title, .ded-name, .ded-line, .ded-sign, .ded-close,
    .intro, .intro-inner, .loves, .closing { transition-duration: .35s !important; transition-delay: 0s !important; animation: none; }
  }

  @media (max-width: 600px) {
    .toast { top: 76px; max-width: 84vw; font-size: 16px; padding: 11px 18px; }
    /* si no, "volver a ver" choca con "abrir carta" en pantallas estrechas */
    .endbar { bottom: 78px; }
    .settings { width: 44px; height: 44px; }
    .panel { width: 200px; }
    .letter-btn { font-size: 15px; padding: 11px 20px; }
    .days { font-size: 13px; padding: 8px 14px; }
    .ded-name { font-size: clamp(40px, 13vw, 64px); }
  }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Campo animado de flores amarillas que cambia del día a la noche"></canvas>
<noscript>
  <div class="noscript-note">
    <h1>Flores Amarillas · para Ericka</h1>
    <p>Entre todas las flores, elegí las amarillas: las que florecen incluso en los días grises.</p>
    <p>Activa JavaScript para ver el jardín completo.</p>
  </div>
</noscript>
<div class="gate" id="gate" hidden>
  <div class="gate-inner">
    <svg class="flower" viewBox="0 0 64 64" aria-hidden="true">
      <g transform="translate(32 34)" fill="#ffd06a">
        <ellipse cx="0" cy="-15" rx="7" ry="13"/>
        <ellipse cx="0" cy="-15" rx="7" ry="13" transform="rotate(60)"/>
        <ellipse cx="0" cy="-15" rx="7" ry="13" transform="rotate(120)"/>

<script>
(() => {
  "use strict";

  /* =====================================================================

  const GIFT = {

      { n: 5,  texto: "Cinco flores... y ya no puedo dejar de pensar en ti." },
      { n: 12, texto: "Doce flores: una por cada mes que quiero a tu lado." },
      { n: 21, texto: "Veintiuna flores, como este 21 de septiembre. Todo florece contigo." },
      { n: 40, texto: "Cuarenta flores y todavía me faltan formas de decirte lo que siento." },
      { n: 70, texto: "Setenta flores. Este jardín ya es tan tuyo como mi corazón." }
    ],
    recuerdos: [
      { titulo: "El día que te conocí", texto: "Sin saberlo, ese día empezó a florecer algo que todavía no se detiene. Llegaste y, sin hacer ruido, te quedaste en todo." },
      { titulo: "Tu risa", texto: "Hay sonidos que ordenan el día. El tuyo es mi favorito: cuando te ríes, hasta el campo se pone más amarillo." },
      { titulo: "Aquella noche", texto: "No hizo falta nada especial. Solo tú, el tiempo pasando despacio y yo pensando que no quería estar en ningún otro lugar." },
      { titulo: "Lo que viene", texto: "Todavía nos quedan primaveras por ver. Y si de mí depende, quiero verlas todas contigo." }
    ],
    carta: [
      "Ericka:\n\nSi llegaste hasta aquí, es porque quería regalarte algo que no se marchitara al día siguiente. Por eso hice crecer este campo: cada flor amarilla es una forma distinta de decirte lo mismo.",
      "Dicen que las flores amarillas significan amistad, cariño y luz. Pero contigo significan algo más simple y más enorme a la vez: la alegría de tenerte cerca. Eres de esas personas que llegan y, sin hacer ruido, iluminan todo.",
      "Me gusta cómo florece el mundo cuando estás. Me gusta tu risa, tu forma de mirar, las cosas que dices sin darte cuenta. Este 21 de septiembre quería que el tiempo se detuviera un rato para recordarte lo especial que eres.",
      "Quédate un momento más: mira cómo la tarde se vuelve noche, cómo salen las luciérnagas y los farolillos. Cuando oscurezca, busca tu nombre escrito con estrellas y toca las estrellas rosadas: guardan pequeños recuerdos para ti. Y si logras alcanzar una estrella fugaz, pídele un deseo.",
      "No sé cuántas primaveras nos esperan, pero si depende de mí, quiero pasarlas todas contigo. Gracias por existir, Ericka. Gracias por ser mi flor amarilla favorita."
    ]
  };
  /* ===================================================================== */

  /* ================= apertura programada ================= */

  const gateEl = document.getElementById("gate");
  let gateOpen = true;

  function aperturaDate() {
    if (!GIFT.apertura) return null;
    /* sin huso, "2026-09-21T00:15" se interpreta en la hora local de quien mira */
    const d = new Date(GIFT.apertura + (GIFT.husoHorario || ""));
    return isNaN(d.getTime()) ? null : d;
  }

  function two(n) { return n < 10 ? "0" + n : String(n); }

  function openGate() {
    if (gateOpen) return;
    gateOpen = true;
    gateEl.classList.add("hide");
    setTimeout(() => { if (gateEl.parentNode) gateEl.remove(); }, 1800);
  }

  function startGate(target) {
    gateOpen = false;
    gateEl.hidden = false;
    gateEl.addEventListener("pointerdown", e => e.stopPropagation());
    document.getElementById("gateFor").textContent = GIFT.paraTi || ("para " + GIFT.para);
    let cuando = "";
    try {
      cuando = target.toLocaleDateString("es-ES", { day: "numeric", month: "long" }) +
               " a las " + target.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
    } catch (e) {}
    document.getElementById("gateNote").textContent =
      cuando ? "Este jardín florece el " + cuando + "." : "Este jardín todavía no ha florecido.";
    document.getElementById("gateSoon").textContent = "vuelve en ese momento: te estará esperando";

    const dEl = document.getElementById("cD"), hEl = document.getElementById("cH");
    const mEl = document.getElementById("cM"), sEl = document.getElementById("cS");
    const dBox = document.getElementById("cBoxD");
    let timer = null, shown = -1;
    function tick() {
      const left = target.getTime() - Date.now();
      const secs = Math.max(0, Math.ceil(left / 1000));
      if (secs !== shown) {
        shown = secs;
        const days = Math.floor(secs / 86400);
        dBox.hidden = days === 0;   /* el último día sobra la casilla de días */
        dEl.textContent = days;
        hEl.textContent = two(Math.floor(secs / 3600) % 24);
        mEl.textContent = two(Math.floor(secs / 60) % 60);
        sEl.textContent = two(secs % 60);
      }
      if (left <= 0) { clearInterval(timer); openGate(); }
    }
    tick();
    timer = setInterval(tick, 250);
  }

  let guionVisto = false;
  try { guionVisto = localStorage.getItem("floresGuion") === "1"; } catch (e) {}

  const aperturaT = aperturaDate();
  /* ?abrir (o #abrir) en la URL salta la espera, para poder revisarla antes */
  const saltarEspera = /(^|[?&#])abrir/.test(location.search + location.hash);
  if (aperturaT && !saltarEspera && Date.now() < aperturaT.getTime()) startGate(aperturaT);

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: false });

  let W = 0, H = 0, DPR = 1, horizon = 0;
  let t = 0, wind = 0, mouseSpeed = 0;
  let mouseX = 0.5, mouseY = 0.5, parX = 0, parY = 0;
  let curX = -100, curY = -100, curTX = -100, curTY = -100;
  let dayClock = 0, dayT = 0.12, pal = null;
  /* el guion manda sobre el reloj: la tarde se sostiene y la noche tambien */
  let daySpeed = 0.15;
  const DAY_LEN = 150;

  /* every random draw goes through a seeded generator: the same seed rebuilds
     the exact same field, so resizing (or the mobile address bar sliding away)
     no longer shuffles the whole garden — and she finds her field again on every visit */
  let seed = (Math.floor(Math.random() * 4294967296)) >>> 0;
  try {
    const stored = localStorage.getItem("floresSeed");
    if (stored !== null && /^\d+$/.test(stored)) seed = (parseInt(stored, 10) >>> 0) || seed;
    else localStorage.setItem("floresSeed", String(seed));
  } catch (e) {}
  let rngState = seed;
  function reseed() { rngState = seed; }
  function srand() {
    rngState = (rngState + 0x6D2B79F5) >>> 0;
    let x = rngState;
    x = Math.imul(x ^ (x >>> 15), x | 1);
    x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  }
  const rand = (a, b) => a + srand() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, x) => a + (b - a) * x;
  const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a), 0, 1); return u * u * (3 - 2 * u); };

  function hexToRgb(h) {
    h = h.replace("#", "");
    if (h.length === 3) h = h.split("").map(c => c + c).join("");
    const n = parseInt(h, 16);
    return [n >> 16 & 255, n >> 8 & 255, n & 255];
  }
  const rgbStr = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  const lerpRgb = (a, b, x) => [a[0] + (b[0] - a[0]) * x, a[1] + (b[1] - a[1]) * x, a[2] + (b[2] - a[2]) * x];

  /* 5x7 dot font for the starry name */
  const FONT5x7 = {
    A: ["01110","10001","10001","11111","10001","10001","10001"], B: ["11110","10001","10001","11110","10001","10001","11110"],
    C: ["01110","10001","10000","10000","10000","10001","01110"], D: ["11110","10001","10001","10001","10001","10001","11110"],
    E: ["11111","10000","10000","11110","10000","10000","11111"], F: ["11111","10000","10000","11110","10000","10000","10000"],
    G: ["01110","10001","10000","10111","10001","10001","01110"], H: ["10001","10001","10001","11111","10001","10001","10001"],
    I: ["11111","00100","00100","00100","00100","00100","11111"], J: ["00111","00010","00010","00010","00010","10010","01100"],
    K: ["10001","10010","10100","11000","10100","10010","10001"], L: ["10000","10000","10000","10000","10000","10000","11111"],
    M: ["10001","11011","10101","10101","10001","10001","10001"], N: ["10001","11001","10101","10011","10001","10001","10001"],
    O: ["01110","10001","10001","10001","10001","10001","01110"], P: ["11110","10001","10001","11110","10000","10000","10000"],
    Q: ["01110","10001","10001","10001","10101","10010","01101"], R: ["11110","10001","10001","11110","10100","10010","10001"],
    S: ["01111","10000","10000","01110","00001","00001","11110"], T: ["11111","00100","00100","00100","00100","00100","00100"],
    U: ["10001","10001","10001","10001","10001","10001","01110"], V: ["10001","10001","10001","10001","10001","01010","00100"],
    W: ["10001","10001","10001","10101","10101","11011","10001"], X: ["10001","10001","01010","00100","01010","10001","10001"],
    Y: ["10001","10001","01010","00100","00100","00100","00100"], Z: ["11111","00001","00010","00100","01000","10000","11111"],
    " ": ["00000","00000","00000","00000","00000","00000","00000"]
  };

  let flowers = [], grass = [], pollen = [], falling = [], stars = [];
  let butterflies = [], fireflies = [], clouds = [], hills = [];
  let shooting = [], bursts = [], hearts = [], trail = [];
  let rockets = [], sparks = [], fireworkQueue = 0, fireworkTimer = 0;
  let memories = [], nameConst = [], birds = [], bees = [], ladybugs = [];
  let lanterns = [], dragonflies = [], koi = [], pond = null, garland = null, lanternsReleased = false;
  let flowersPlanted = 0, milestoneIdx = 0, finaleDone = false;
  let returning = false;   /* ya habia estado aqui: sus flores siguen plantadas */
  let soft = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const q = (n) => Math.max(1, Math.round(n * (soft ? 0.5 : 1)));
  let auroraBoost = 0, petalRainT = 0;
  let plantedSpots = [];

  /* ================= day / night palette ================= */

  const SKY_KEYS = [
    { p: 0.00, top: "#1d5a86", mid: "#3f8bb0", h1: "#a9c9d8", h2: "#e8d9a0", g1: "#3a3a24", g2: "#14140c", star: 0.00, fire: 0.00, ray: 0.15, sun: "#fff6d0" },
    { p: 0.25, top: "#3a1f4a", mid: "#8a3a52", h1: "#d9663a", h2: "#ffb45a", g1: "#2b2514", g2: "#090806", star: 0.35, fire: 0.45, ray: 0.90, sun: "#ff8a3a" },
    { p: 0.34, top: "#12102c", mid: "#2a2a52", h1: "#5a4a6a", h2: "#8a6a6a", g1: "#1a1820", g2: "#07060a", star: 0.75, fire: 0.90, ray: 0.35, sun: "#e06a3a" },
    { p: 0.50, top: "#01030c", mid: "#050b1c", h1: "#0a1830", h2: "#142842", g1: "#0a0e18", g2: "#030407", star: 1.00, fire: 1.00, ray: 0.00, sun: "#88a0ff" },
    { p: 0.66, top: "#02040e", mid: "#060d20", h1: "#0b1a34", h2: "#16294a", g1: "#0a0e18", g2: "#030407", star: 1.00, fire: 1.00, ray: 0.00, sun: "#88a0ff" },
    { p: 0.76, top: "#1a1c3a", mid: "#4a3a5a", h1: "#b06a4a", h2: "#f0a860", g1: "#1e1a18", g2: "#080605", star: 0.40, fire: 0.50, ray: 0.70, sun: "#ffb060" },
    { p: 0.88, top: "#153a5a", mid: "#3a7a9a", h1: "#a0b898", h2: "#f0e0a0", g1: "#2e2e1c", g2: "#101008", star: 0.05, fire: 0.10, ray: 0.50, sun: "#ffe0a0" },
    { p: 1.00, top: "#1d5a86", mid: "#3f8bb0", h1: "#a9c9d8", h2: "#e8d9a0", g1: "#3a3a24", g2: "#14140c", star: 0.00, fire: 0.00, ray: 0.15, sun: "#fff6d0" }
  ].map(k => ({
    p: k.p, top: hexToRgb(k.top), mid: hexToRgb(k.mid), h1: hexToRgb(k.h1), h2: hexToRgb(k.h2),
    g1: hexToRgb(k.g1), g2: hexToRgb(k.g2), sun: hexToRgb(k.sun), star: k.star, fire: k.fire, ray: k.ray
  }));

  function getPalette(p) {
    let a = SKY_KEYS[0], b = SKY_KEYS[SKY_KEYS.length - 1];
    for (let i = 0; i < SKY_KEYS.length - 1; i++) {
      if (p >= SKY_KEYS[i].p && p <= SKY_KEYS[i + 1].p) { a = SKY_KEYS[i]; b = SKY_KEYS[i + 1]; break; }
    }
    const k = (p - a.p) / ((b.p - a.p) || 1), L = (x, y) => lerpRgb(x, y, k);
    return {
      top: L(a.top, b.top), mid: L(a.mid, b.mid), h1: L(a.h1, b.h1), h2: L(a.h2, b.h2),
      g1: L(a.g1, b.g1), g2: L(a.g2, b.g2), sun: L(a.sun, b.sun),
      star: lerp(a.star, b.star, k), fire: lerp(a.fire, b.fire, k), ray: lerp(a.ray, b.ray, k)
    };
  }

  function sunPos() {
    const a = Math.cos(dayT * Math.PI * 2);
    return { x: W * (0.5 + 0.5 * Math.sin(dayT * Math.PI * 2)), y: horizon - H * 0.55 * a, a };
  }
  function moonPos() {
    const a = -Math.cos(dayT * Math.PI * 2);
    return { x: W * (0.5 - 0.5 * Math.sin(dayT * Math.PI * 2)), y: horizon - H * 0.5 * a, a };
  }

  /* ================= flowers ================= */

  function createFlower(x, baseY, sizeF, delay, birth) {
    const hue = rand(44, 53);
    const f = {
      x, baseY, sizeF, birth: birth || 0,
      height: rand(72, 150) * sizeF, stemW: rand(3, 5.5) * sizeF,
      speed: rand(0.7, 1.4), phase: rand(0, 6.28), amp: rand(6, 16) * sizeF,

  function updateBees(dt) {
    const dayAmt = clamp(1 - pal.star * 1.4, 0, 1);
    for (const b of bees) {
      b.dayAmt = dayAmt;
      if (b.hover > 0) {
        b.hover -= dt;
        b.x += Math.sin(t * 20 + b.phase) * 8 * dt;
        b.y += Math.cos(t * 17 + b.phase) * 8 * dt;
      } else {
        if (!b.target || b.target.growth < 0.5 || srand() < dt * 0.25) {
          if (flowers.length) b.target = flowers[Math.floor(srand() * flowers.length)];
        }
        if (b.target) { const pt = stemPoint(b.target, 1); b.tx = pt.x; b.ty = pt.y; }
        const dx = b.tx - b.x, dy = b.ty - b.y, d = Math.hypot(dx, dy) || 1, speed = 70 * b.sp;
        b.vx += ((dx / d) * speed - b.vx) * Math.min(1, dt * 3);
        b.vy += ((dy / d) * speed - b.vy) * Math.min(1, dt * 3);
        b.vx += wind * 14 * dt;
        b.x += b.vx * dt; b.y += b.vy * dt;
        if (d < 14) { b.hover = rand(0.6, 1.6); b.vx *= 0.2; b.vy *= 0.2; }
      }
      b.flap += dt * 40;
      if (Math.abs(b.vx) > 3) b.dir = b.vx < 0 ? -1 : 1;
    }
  }

  function drawBee(b) {
    if (b.dayAmt <= 0.03) return;
    const s = b.size;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(b.dir, 1);
    ctx.globalAlpha = b.dayAmt * 0.4;
    ctx.fillStyle = "rgba(235,242,255,0.9)";
    const wing = 0.2 + 0.8 * Math.abs(Math.sin(b.flap));
    ctx.beginPath(); ctx.ellipse(-s * 0.1, -s * 0.85, s * 0.95, s * 0.5 * wing, -0.4, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s * 0.3, -s * 0.75, s * 0.8, s * 0.45 * wing, -0.3, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = b.dayAmt;
    const bg = ctx.createLinearGradient(-s, 0, s, 0);
    bg.addColorStop(0, "#f4c93f"); bg.addColorStop(1, "#dfa41c");
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, 0, s, s * 0.62, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "rgba(38,28,10,0.85)";
    ctx.beginPath(); ctx.ellipse(-s * 0.12, 0, s * 0.15, s * 0.58, 0, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(s * 0.35, 0, s * 0.15, s * 0.52, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#2a2418";
    ctx.beginPath(); ctx.arc(-s * 0.95, 0, s * 0.34, 0, 6.2832); ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1;
  }

  function spawnFlock() {
    const dir = srand() < 0.5 ? 1 : -1;
    const baseY = rand(horizon * 0.12, horizon * 0.5);
    const speed = rand(38, 74) * dir;
    const n = 4 + Math.floor(srand() * 6);
    const startX = dir > 0 ? rand(-260, -120) : W + rand(120, 260);
    for (let i = 0; i < n; i++) {
      const row = Math.floor(i / 2);
      birds.push({
        x: startX - dir * row * 20 + rand(-8, 8),
        y: baseY + row * 15 + rand(-6, 6),
        vx: speed + rand(-5, 5), flap: rand(0, 6.2832), flapSp: rand(6, 10),
        size: rand(5, 9), dir, alpha: 0
      });
    }
  }

  function updateBirds(dt) {
    if (pal.star < 0.45 && birds.length < 46 && srand() < dt * 0.18) spawnFlock();
    for (let i = birds.length - 1; i >= 0; i--) {
      const b = birds[i];
      b.x += b.vx * dt;
      b.y += Math.sin(t * 1.5 + b.flap * 0.2) * 6 * dt;
      b.flap += b.flapSp * dt;
      b.alpha = Math.min(1, b.alpha + dt * 0.8);
      if (b.x < -320 || b.x > W + 320) birds.splice(i, 1);
    }
  }

  function drawBirds() {
    if (!birds.length) return;
    const n = pal.star;
    const col = `rgba(${lerp(44, 96, n) | 0},${lerp(40, 86, n) | 0},${lerp(48, 108, n) | 0},`;
    for (const b of birds) {
      const flap = Math.sin(b.flap), w = b.size;
      ctx.save(); ctx.translate(b.x, b.y); ctx.scale(b.dir, 1);
      ctx.strokeStyle = col + (0.55 * b.alpha) + ")";
      ctx.lineWidth = Math.max(1, w * 0.16); ctx.lineCap = "round";
      const spread = w * (0.5 + 0.5 * Math.abs(flap)), lift = w * flap * 0.55;
      ctx.beginPath();
      ctx.moveTo(-spread, lift);
      ctx.quadraticCurveTo(-spread * 0.4, -lift * 0.5, 0, 0);
      ctx.quadraticCurveTo(spread * 0.4, -lift * 0.5, spread, lift);
      ctx.stroke();
      ctx.restore();
    }
  }

  function updateLadybugs(dt) {
    const dayAmt = clamp(1 - pal.star * 1.6, 0, 1);
    for (const b of ladybugs) {
      b.dayAmt = dayAmt;
      if (b.mode === "sit") {
        if (!b.flower || b.flower.growth < 0.5) b.flower = flowers.length ? flowers[Math.floor(srand() * flowers.length)] : null;
        if (b.flower) {
          const pt = stemPoint(b.flower, 1);
          const hr = b.flower.petalW * 0.95 * b.flower.growth * 1.1;
          b.x = pt.x + Math.cos(b.ang) * hr * b.rad;
          b.y = pt.y + Math.sin(b.ang) * hr * b.rad;
        }
        b.walkT -= dt;
        if (b.walkT <= 0) {
          if (srand() < 0.3 && flowers.length) {
            b.mode = "fly"; b.flyT = 0;
            b.targetFlower = flowers[Math.floor(srand() * flowers.length)];
            b.vx = rand(-40, 40); b.vy = rand(-60, -20);
          } else {
            b.ang += rand(-1.5, 1.5); b.walkT = rand(1.5, 4);
          }
        }
        b.wing += (0 - b.wing) * Math.min(1, dt * 8);
      } else {
        b.flyT += dt;
        b.wing += (1 - b.wing) * Math.min(1, dt * 10);
        if (b.targetFlower && b.targetFlower.growth > 0.5) {
          const pt = stemPoint(b.targetFlower, 1);
          const dx = pt.x - b.x, dy = pt.y - b.y, d = Math.hypot(dx, dy) || 1, sp = 90;
          b.vx += ((dx / d) * sp - b.vx) * Math.min(1, dt * 4);
          b.vy += ((dy / d) * sp - b.vy) * Math.min(1, dt * 4);
        }
        b.vx += wind * 20 * dt;
        b.x += b.vx * dt; b.y += b.vy * dt;
        if (Math.abs(b.vx) > 2) b.dir = b.vx < 0 ? -1 : 1;
        if (b.flyT > 0.8 && b.targetFlower) {
          const pt = stemPoint(b.targetFlower, 1);
          if (Math.hypot(pt.x - b.x, pt.y - b.y) < 12) {
            b.mode = "sit"; b.flower = b.targetFlower; b.targetFlower = null;
            b.ang = rand(0, 6.2832); b.rad = rand(0.15, 0.55); b.walkT = rand(1.5, 4);
          }
        }
        if (b.flyT > 6) { b.mode = "sit"; b.flyT = 0; b.walkT = rand(1, 3); }
      }
    }
  }

  function drawLadybug(b) {
    if (b.dayAmt <= 0.03) return;
    const s = b.size, flying = b.mode === "fly";
    ctx.save();
    ctx.globalAlpha = b.dayAmt;
    ctx.translate(b.x, b.y);
    ctx.rotate(flying ? 0 : b.ang);
    ctx.scale(b.dir, 1);
    if (flying) {
      ctx.globalAlpha = b.dayAmt * 0.35;
      ctx.fillStyle = "rgba(240,245,255,0.9)";
      const wl = 0.5 + 0.5 * b.wing;
      ctx.beginPath(); ctx.ellipse(-s * 0.7, -s * 0.2, s * 0.9, s * 0.4 * wl, -0.5, 0, 6.2832); ctx.fill();
      ctx.beginPath(); ctx.ellipse(s * 0.7, -s * 0.2, s * 0.9, s * 0.4 * wl, 0.5, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = b.dayAmt;
    }
    ctx.strokeStyle = "#1a1a1a"; ctx.lineWidth = Math.max(0.5, s * 0.12);
    ctx.beginPath();
    ctx.moveTo(-s * 0.5, 0); ctx.lineTo(-s * 0.95, s * 0.35);
    ctx.moveTo(s * 0.5, 0); ctx.lineTo(s * 0.95, s * 0.35);
    ctx.stroke();
    const bg = ctx.createLinearGradient(0, -s, 0, s);
    bg.addColorStop(0, "#e5483a"); bg.addColorStop(1, "#b8291f");
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, 0, s, s * 0.85, 0, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = "#1a1a1a"; ctx.lineWidth = Math.max(0.6, s * 0.14);
    ctx.beginPath(); ctx.moveTo(0, -s * 0.55); ctx.lineTo(0, s * 0.85); ctx.stroke();
    ctx.fillStyle = "#1a1a1a";
    for (const sp of [[-0.4, -0.25], [0.4, -0.25], [-0.35, 0.3], [0.35, 0.3], [0, 0.55]]) {
      ctx.beginPath(); ctx.arc(sp[0] * s, sp[1] * s, s * 0.2, 0, 6.2832); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(0, -s * 0.85, s * 0.45, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = "#1a1a1a"; ctx.lineWidth = Math.max(0.5, s * 0.09);
    ctx.beginPath();
    ctx.moveTo(-s * 0.15, -s * 1.15); ctx.lineTo(-s * 0.35, -s * 1.6);
    ctx.moveTo(s * 0.15, -s * 1.15); ctx.lineTo(s * 0.35, -s * 1.6);
    ctx.stroke();
    ctx.restore(); ctx.globalAlpha = 1;
  }
